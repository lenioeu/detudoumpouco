<header class="cabecalho">
  <div class="cabecalho__interno">
    <a class="marca" href="/">
      <span class="marca__selo">{{selo}}</span>
      <span class="marca__nome">{{nome}}</span>
    </a>
    <nav class="cabecalho__acoes" aria-label="Atalhos">
      <button type="button" class="botao-icone sequencia-mini" data-sequencia-cabecalho data-abrir-progresso aria-label="Sequência">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5.5C10 9.5 11 11 12 11c0-3-1.5-5 0-9z" fill="var(--cor)" stroke="var(--tinta)" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span data-numero>0</span>
      </button>
      <button type="button" class="botao-icone" data-abrir-progresso aria-label="Seu progresso">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M3 21V13h6v8M9 21V8h6v13M15 21v-5h6v5Z"/></svg>
      </button>
      <a class="botao-icone" href="/como-jogar" aria-label="Como jogar">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 2-2.3 3.5"/><path d="M12 17h.01"/></svg>
      </a>
    </nav>
  </div>
</header>
