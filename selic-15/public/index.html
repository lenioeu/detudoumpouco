   <section class="card" id="cfg-usuarios"><h2>Usuários e níveis de acesso</h2>
    <div class="aviso small"><b>Como funciona o acesso:</b> para entrar no SELIC-15, o e-mail precisa estar liberado no login da Cloudflare (Zero Trust → Access → Applications → SELIC-15 → política da equipe). O nível abaixo define o que a pessoa pode fazer depois de entrar. Quem entra pela primeira vez sem estar nesta lista fica <b>aguardando aprovação</b> e não vê nenhum dado até você aprovar. Se preferir, cadastre o e-mail antes, já com o nível certo, e a pessoa entra direto.</div>
    <ul class="niveis small"><li><b>Administrador:</b> tudo, inclusive configurações, usuários e colunas.</li><li><b>Editor:</b> cria e altera processos, contratos, tarefas, agenda e parcerias.</li><li><b>Leitor:</b> só consulta (indicado para gestores e fiscais).</li></ul>
    <div class="tbl"><table class="cfgt"><thead><tr><th>Nome</th><th>E-mail</th><th>Nível</th><th></th></tr></thead><tbody id="usrBody"><tr><td colspan="4" class="muted">Carregando…</td></tr></tbody></table></div>
    <form id="fusr" class="form" style="margin-top:12px;grid-template-columns:1fr 1fr 160px auto;align-items:end">
     <label>Nome<input id="nu-nome" placeholder="Ex.: Anna Souza"></label><label>E-mail<input id="nu-email" type="email" required placeholder="nome@exemplo.com"></label>
     <label>Nível<select id="nu-nivel">${Object.entries(NIVEL_NOME).map(([k,n])=>`<option value="${k}" ${k==='editor'?'selected':''}>${n}</option>`).join('')}</select></label>
     <button class="btn pri" type="submit">Adicionar</button><span id="usrmsg" class="muted small full"></span></form></section>

   <section class="card" id="cfg-equipe"><h2>Equipe</h2>
    <p class="muted small">Pessoas que aparecem como sugestão nos campos de responsável, gestor e fiscal. Não precisam ter acesso ao sistema.</p>
    <div class="tbl"><table class="cfgt"><thead><tr><th>Nome</th><th>Função</th><th>Setor</th><th>E-mail</th><th></th></tr></thead><tbody>
     ${pes.map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.funcao||'')}</td><td>${esc(x.setor||'')}</td><td>${esc(x.email||'')}</td>
      <td style="white-space:nowrap"><button class="btn sm" type="button" data-pe="${esc(x.id)}">Editar</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Ninguém cadastrado ainda.</td></tr>'}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" type="button" id="novaPessoa">+ Nova pessoa</button>
     <button class="btn" type="button" id="importPess">Importar nomes já usados no sistema</button><span id="pesmsg" class="muted small" style="align-self:center"></span></div></section>

   <section class="card" id="cfg-setores"><h2>Setores demandantes</h2>
    <p class="muted small">Setores que aparecem na ficha do processo e no Painel do PCA. Remover um setor não apaga a informação dos processos que já o usam: eles continuam mostrando o nome, marcado como "fora da lista", até alguém trocar.</p>
    <ul class="setores" id="setLista">${SETORES().map((s,i)=>{const n=[...S.proc.values()].filter(p=>p.setor===s).length;
      return `<li><b>${esc(s)}</b><span class="muted small">${n} processo(s)</span><button class="btn sm" type="button" data-rmset="${i}">Remover</button></li>`}).join('')||'<li class="muted">Nenhum setor cadastrado.</li>'}</ul>
    <form id="fset" class="form" style="grid-template-columns:minmax(0,320px) auto;align-items:end;margin-top:10px">
     <label>Novo setor<input id="ns-nome" maxlength="60" placeholder="Ex.: COMUNICAÇÃO"></label><button class="btn pri">Adicionar setor</button>
     <span id="setmsg" class="muted small full"></span></form></section>

   <section class="card" id="cfg-param"><h2>Parâmetros</h2>
    <form class="form" id="fparam" style="max-width:520px"><label class="full">Janela de renovação de contratos (dias antes do fim da vigência)
     <input type="number" id="pr-janela" min="30" max="365" value="${JANELA()}"></label>
     <p class="full muted small" style="margin:0">Usada nos alertas, no calendário, na linha do tempo e nos indicadores. Padrão: 120 dias.</p>
     <div class="full"><span id="prmsg" class="muted small"></span> <button class="btn pri">Salvar parâmetros</button></div></form></section>

   <section class="card" id="cfg-email"><h2>Relatório diário por e-mail</h2>
    <p class="muted small">Todo dia às <b>20h</b>, o SELIC-15 envia a planilha completa (a mesma do "Exportar tudo") para os e-mails abaixo, com um resumo do dia no corpo da mensagem.</p>
    <div id="relStatus" class="aviso small">Verificando…</div>
    <form class="form" id="frel" style="max-width:640px">
     <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="rl-ativo" style="width:auto" ${(S.config.get('relatorio')||{}).ativo?'checked':''}> Enviar o relatório todo dia às 20h</label>
     <label class="full">E-mail remetente (o mesmo verificado no Brevo)<input type="email" id="rl-remetente" value="${esc((S.config.get('relatorio')||{}).remetente||'')}" placeholder="ex.: selic@crefito15.org.br"></label>
     <label class="full">Quem recebe (um e-mail por linha)<textarea id="rl-dest" placeholder="nome@crefito15.org.br">${esc(((S.config.get('relatorio')||{}).destinatarios||[]).join('\n'))}</textarea></label>
     <div class="full" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span id="rlmsg" class="muted small" style="margin-right:auto"></span>
      <button class="btn" type="button" id="rlTeste">Enviar agora para testar</button><button class="btn pri">Salvar</button></div></form></section>
  </div>`;
  // colunas
  const body=$('#colsBody');
  body.oninput=body.onchange=e=>{const tr=e.target.closest('tr');if(!tr)return;const c=cfgCols[+tr.dataset.i],k=e.target.dataset.k;if(!k)return;c[k]=e.target.type==='checkbox'?e.target.checked:e.target.value};
  body.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.up){const i=+d.up;[cfgCols[i-1],cfgCols[i]]=[cfgCols[i],cfgCols[i-1]]}
    else if(d.down){const i=+d.down;[cfgCols[i+1],cfgCols[i]]=[cfgCols[i],cfgCols[i+1]]}
    else if(d.rm){const c=cfgCols[+d.rm];if(c._novo||!cont(c.id))cfgCols.splice(+d.rm,1);else{c._remover=true;c.destino=cfgCols.find(o=>o!==c&&!o._remover)?.id}}
    else if(d.keep){delete cfgCols[+d.keep]._remover}
    else return;vConfig()};
  $('#addCol').onclick=()=>{cfgCols.push({id:'col-'+Math.random().toString(36).slice(2,8),nome:'Nova coluna',etapa:'andamento',designacao:false,_novo:true});vConfig()};
  $('#resetCol').onclick=()=>{cfgCols=null;vConfig()};
  $('#saveCol').onclick=async()=>{
    const fica=cfgCols.filter(c=>!c._remover);
    if(!fica.length)return $('#colmsg').textContent='O fluxo precisa de pelo menos uma coluna.';
    if(fica.some(c=>!c.nome.trim()))return $('#colmsg').textContent='Dê um nome a todas as colunas.';
    $('#colmsg').textContent='Salvando…';
    try{for(const c of cfgCols.filter(c=>c._remover)){const dest=fica.find(o=>o.id===c.destino)||fica[0];
        for(const p of [...S.proc.values()].filter(p=>faseDe(p)===c.id))await upd('processos',p.id,{fase:dest.id},`Coluna "${c.nome}" removida; processo movido para "${dest.nome}"`,'fase',true)}
      await API('PUT','/docs/config/quadro',{data:{colunas:fica.map(c=>({id:c.id,nome:c.nome.trim(),etapa:c.etapa,designacao:!!c.designacao}))},texto:'Colunas do fluxo de processos alteradas'});
      await sync();cfgCols=null;vConfig();toast('Colunas salvas')}
    catch(er){$('#colmsg').textContent='Não foi possível salvar ('+(er.message||er.code)+').'}};
  // usuários
  const carregarUsr=async()=>{try{S.usuarios=await API('GET','/usuarios')}catch{return}
    marcarPendentes();const ord={pendente:0,admin:1,editor:2,leitor:3,bloqueado:4};
    $('#usrBody').innerHTML=[...S.usuarios].sort((a,b)=>(ord[a.nivel]??5)-(ord[b.nivel]??5)||(a.nome||a.email).localeCompare(b.nome||b.email)).map(u=>u.nivel==='pendente'
     ?`<tr data-em="${esc(u.email)}" class="pend"><td><b>${esc(u.nome||'(não informou o nome)')}</b><br><span class="small muted">pediu acesso em ${u.criado_em?new Date(u.criado_em).toLocaleDateString('pt-BR'):'—'}</span></td><td>${esc(u.email)}</td>
       <td><span class="chip warn">Aguardando aprovação</span></td><td style="white-space:nowrap"><button class="btn sm pri" type="button" data-apr="editor">Aprovar como Editor</button> <button class="btn sm" type="button" data-apr="leitor">Aprovar como Leitor</button> <button class="btn sm" type="button" data-apr="bloqueado">Recusar</button></td></tr>`
     :`<tr data-em="${esc(u.email)}"><td><input data-k="nome" value="${esc(u.nome||'')}" aria-label="Nome" placeholder="(sem nome)"></td><td>${esc(u.email)}${u.email===S.me?' <span class="chip acc">você</span>':''}</td>
      <td><select data-k="nivel" aria-label="Nível">${Object.entries(NIVEL_NOME).map(([k,n])=>`<option value="${k}" ${k===u.nivel?'selected':''}>${n}</option>`).join('')}</select></td>
      <td style="white-space:nowrap"><button class="btn sm" type="button" data-save>Salvar</button> ${u.email===S.me?'':'<button class="btn sm" type="button" data-del>Remover</button>'}</td></tr>`).join('')};
  carregarUsr();
  $('#usrBody').onclick=async e=>{const tr=e.target.closest('tr[data-em]');if(!tr)return;const em=tr.dataset.em;
    const apr=e.target.closest('[data-apr]');if(apr){const u=S.usuarios.find(x=>x.email===em);
      try{await API('PUT','/usuarios/'+encodeURIComponent(em),{nome:u?.nome||'',nivel:apr.dataset.apr});
        toast(apr.dataset.apr==='bloqueado'?'Acesso recusado':'Acesso aprovado',async()=>{await API('PUT','/usuarios/'+encodeURIComponent(em),{nome:u?.nome||'',nivel:u?.nivel||'pendente'});carregarUsr();carregarPainel()});carregarUsr();carregarPainel()}catch(er){$('#usrmsg').textContent=er.message||'Não foi possível salvar.'}return}
    if(e.target.matches('[data-save]')){const u0=S.usuarios.find(x=>x.email===em);try{await API('PUT','/usuarios/'+encodeURIComponent(em),{nome:tr.querySelector('[data-k=nome]').value.trim(),nivel:tr.querySelector('[data-k=nivel]').value});
      toast('Usuário atualizado',u0&&(async()=>{await API('PUT','/usuarios/'+encodeURIComponent(em),{nome:u0.nome||'',nivel:u0.nivel});carregarUsr()}));carregarUsr()}catch(er){$('#usrmsg').textContent=er.message||'Não foi possível salvar.'}}
    if(e.target.matches('[data-del]')){const b=e.target;if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Confirmar';return}
      try{await API('DELETE','/usuarios/'+encodeURIComponent(em));toast('Usuário removido do sistema');carregarUsr()}catch(er){$('#usrmsg').textContent=er.message||'Não foi possível remover.'}}};
  $('#fusr').onsubmit=async e=>{e.preventDefault();try{await API('POST','/usuarios',{email:$('#nu-email').value.trim(),nome:$('#nu-nome').value.trim(),nivel:$('#nu-nivel').value});
    $('#nu-email').value='';$('#nu-nome').value='';$('#usrmsg').textContent='Adicionado. Lembre de liberar o e-mail também no login da Cloudflare.';carregarUsr()}catch(er){$('#usrmsg').textContent=er.message||'Não foi possível adicionar.'}};
  // equipe
  $('#novaPessoa').onclick=()=>abrirPessoa(null,{nome:'',funcao:FUNCOES[0]});
  $('#main').querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>abrirPessoa(b.dataset.pe));
  $('#importPess').onclick=async()=>{const ja=new Set([...S.pessoas.values()].map(x=>norm(x.nome)));
    const gest=new Set(),fisc=new Set();for(const p of S.proc.values())for(const e of p.equipe||[])if(e.nome)(e.papel==='Gestor'?gest:fisc).add(e.nome);
    const novos=nomesEquipe().filter(n=>!ja.has(norm(n)));if(!novos.length)return $('#pesmsg').textContent='Nenhum nome novo para importar.';
    $('#pesmsg').textContent=`Importando ${novos.length}…`;
    for(const n of novos)await criar('pessoas',{nome:n,funcao:gest.has(n)?'Gestor(a) de contrato':fisc.has(n)?'Fiscal de contrato':'Servidor(a) da SELIC',setor:'',email:''},true);
    toast(`${novos.length} pessoas importadas`);vConfig()};
  // setores demandantes
  const salvarSetores=async(lista,msg)=>{const ant=[...SETORES()];try{await API('PUT','/docs/config/setores',{data:{lista},texto:msg});await sync();
    toast(msg,async()=>{await API('PUT','/docs/config/setores',{data:{lista:ant},texto:'Alteração de setores desfeita'});await sync();if(S.view==='config')vConfig()});vConfig();setTimeout(()=>document.getElementById('cfg-setores')?.scrollIntoView({block:'start'}),50)}
    catch(er){$('#setmsg').textContent='Não foi possível salvar ('+(er.message||er.code)+').'}};
  $('#setLista').onclick=async e=>{const b=e.target.closest('[data-rmset]');if(!b)return;const s=SETORES()[+b.dataset.rmset],n=[...S.proc.values()].filter(p=>p.setor===s).length;
    if(!await confirmar({titulo:`Remover o setor "${s}"?`,texto:n?`${n} processo(s) usam este setor e vão continuar mostrando o nome, marcado como "fora da lista".`:'Nenhum processo usa este setor.',botao:'Sim, remover'}))return;
    salvarSetores(SETORES().filter(x=>x!==s),`Setor "${s}" removido`)};
  $('#fset').onsubmit=e=>{e.preventDefault();const s=$('#ns-nome').value.trim().toUpperCase();if(!s)return;
    if(SETORES().some(x=>norm(x)===norm(s)))return $('#setmsg').textContent='Esse setor já está na lista.';
    salvarSetores([...SETORES(),s].sort((a,b)=>a.localeCompare(b,'pt-BR')),`Setor "${s}" adicionado`)};
  // relatório diário
  const statusRel=async()=>{try{const s=await API('GET','/relatorio');const u=s.ultimo;
    $('#relStatus').innerHTML=(s.chave?'✓ Chave do Brevo cadastrada na Cloudflare.':'<b>Falta cadastrar a chave do Brevo</b> (BREVO_API_KEY) na Cloudflare. Enquanto isso, o envio não funciona.')
      +'<br>'+(u?`Último envio: ${new Date(u.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})} · ${u.tipo==='relatorio'?'enviado':'falhou'} · ${esc(u.texto||'')}`:'Nenhum envio ainda.');
    $('#relStatus').className='aviso small'+(s.chave&&(!u||u.tipo==='relatorio')?' ok-box':'')}catch{$('#relStatus').textContent='Não foi possível verificar o relatório.'}};
  statusRel();
  const dadosRel=()=>({ativo:$('#rl-ativo').checked,remetente:$('#rl-remetente').value.trim(),destinatarios:$('#rl-dest').value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean)});
  $('#frel').onsubmit=async e=>{e.preventDefault();const d=dadosRel();
    if(d.ativo&&(!d.remetente||!d.destinatarios.length))return $('#rlmsg').textContent='Para ativar, informe o remetente e pelo menos um destinatário.';
    try{await API('PUT','/docs/config/relatorio',{data:d,texto:'Relatório diário: '+(d.ativo?'ativado para '+d.destinatarios.length+' destinatário(s)':'desativado')});await sync();$('#rlmsg').textContent='Salvo.';toast('Configuração do relatório diário salva')}catch(er){$('#rlmsg').textContent='Não foi possível salvar.'}};
  $('#rlTeste').onclick=async()=>{const b=$('#rlTeste');b.disabled=true;$('#rlmsg').textContent='Salvando e enviando…';
    try{await API('PUT','/docs/config/relatorio',{data:dadosRel(),texto:'Relatório diário: configuração salva'});await sync();
      const r=await API('POST','/relatorio');$('#rlmsg').textContent=`Enviado para ${r.para} destinatário(s). Confira a caixa de entrada (e o spam).`}
    catch(er){$('#rlmsg').textContent=er.message||'Não foi possível enviar.'}finally{b.disabled=false;statusRel()}};
  // parâmetros
  $('#fparam').onsubmit=async e=>{e.preventDefault();const j=Math.max(30,Math.min(365,+$('#pr-janela').value||120));
    const ant=copia(S.config.get('parametros')||{});delete ant.id;
    try{await API('PUT','/docs/config/parametros',{data:{...ant,janela:j},texto:`Janela de renovação: ${j} dias`});await sync();carregarPainel();$('#prmsg').textContent='Salvo.';
      toast('Parâmetros salvos',async()=>{await API('PUT','/docs/config/parametros',{data:ant,texto:'Alteração de parâmetros desfeita'});await sync();carregarPainel();if(S.view==='config')vConfig()})}
    catch(er){$('#prmsg').textContent='Não foi possível salvar.'}};
}
function abrirPessoa(id,novo){
  const x=id?S.pessoas.get(id):novo;if(!x)return;S.ficha={tipo:'pessoa',id};
  shell(`<button class="btn sm close" type="button">Fechar</button><span class="sei">Equipe</span><h2>${id?esc(x.nome):'Nova pessoa'}</h2>
   <section><form class="form" id="fpe"><label class="full">Nome<input id="pe-nome" value="${esc(x.nome||'')}" required></label>
    <label>Função<select id="pe-funcao">${FUNCOES.map(o=>`<option ${o===x.funcao?'selected':''}>${o}</option>`).join('')}</select></label>
    <label>Setor<input id="pe-setor" value="${esc(x.setor||'')}" placeholder="Ex.: SELIC, SEFIN"></label>
    <label class="full">E-mail (opcional)<input id="pe-email" type="email" value="${esc(x.email||'')}"></label>
    <div class="full" style="display:flex;gap:8px;align-items:center"><span id="pemsg" class="muted" style="margin-right:auto"></span>
     ${id?'<button class="btn" type="button" id="peDel">Excluir</button>':''}<button class="btn pri">Salvar</button></div></form></section>`);
  $('#fpe').onsubmit=async e=>{e.preventDefault();const v=k=>$('#pe-'+k).value.trim();const d={nome:v('nome'),funcao:v('funcao'),setor:v('setor'),email:v('email')};
    try{if(id){if(!await upd('pessoas',id,d,'','edicao'))return}else await criar('pessoas',d);fechar();if(S.view==='config')vConfig()}catch(er){$('#pemsg').textContent='Não foi possível salvar.'}};
  if(id)$('#peDel').onclick=async ev=>{const b=ev.currentTarget;if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Confirmar exclusão';return}
    try{await apagar('pessoas',id);fechar();if(S.view==='config')vConfig()}catch{$('#pemsg').textContent='Não foi possível excluir.'}};
}

/* ---------- ficha do processo ---------- */
function shell(html){const f=$('#ficha');f.hidden=false;f.innerHTML=`<div class="scrim" data-x></div><div class="drawer" role="dialog" aria-modal="true">${html}</div>`;
  f.querySelector('[data-x]').onclick=fechar;f.querySelectorAll('.close').forEach(b=>b.onclick=fechar);document.onkeydown=e=>{if(e.key==='Escape')fechar()}}
function fechar(){S.ficha=null;$('#ficha').hidden=true;$('#ficha').innerHTML='';document.onkeydown=null}
const opt=(v,cur)=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(FNOME[v]||v)}</option>`;

const NOVO_PROC=()=>({sei:'',seiExtras:[],objeto:'',setor:'',pca:null,tipo:'',fase:COLUNAS[0].id,urgencia:'',obs:'',demanda:'',coffito:false,fontes:[],equipe:[],alertas:[]});
function abrirFicha(id,novo){
  const p=id?S.proc.get(id):novo;if(!p)return;S.ficha={tipo:'proc',id:id||null};
  const nomes=nomesEquipe();
  shell(`<button class="btn sm close" type="button">Fechar</button>
   <span class="sei">${id?esc(p.sei||'sem SEI')+((p.seiExtras||[]).length?' · também '+esc(p.seiExtras.join(', ')):''):'Preencha os dados e clique em "Cadastrar processo"'}</span>
   <h2>${id?esc(p.objeto):'Novo processo'}</h2>
   <div id="fdyn-top"></div>
   <section><h4>Dados do processo</h4>
    <form class="form" id="fp">
     <label class="full">Objeto<input id="f-objeto" value="${esc(p.objeto)}" required placeholder="Ex.: Aquisição de cadeiras para a sala de reunião"></label>
     <label>Número SEI<input id="f-sei" value="${esc(p.sei)}" placeholder="15.1511.000000/2026-00" style="font-family:var(--mono)"></label>
     <label>Fase<select id="f-fase">${FASES.map(([k])=>opt(k,faseDe(p))).join('')}</select></label>
     <label>Urgência<select id="f-urgencia"><option value="">Não definida</option>${Object.entries(URG).reverse().map(([k,n])=>`<option value="${k}" ${k===p.urgencia?'selected':''}>${n}</option>`).join('')}</select></label>
     <label>Setor demandante<select id="f-setor"><option value="">Não informado</option>${[...SETORES(),...(p.setor&&!SETORES().includes(p.setor)?[p.setor]:[])].map(s=>`<option value="${esc(s)}" ${s===p.setor?'selected':''}>${esc(s)}${SETORES().includes(s)?'':' (fora da lista)'}</option>`).join('')}</select></label>
     <label>Previsto no PCA<select id="f-pca"><option value="">Não informado</option><option value="s" ${p.pca===true?'selected':''}>Sim</option><option value="n" ${p.pca===false?'selected':''}>Não</option></select></label>
     <label>Tipo de contratação<input id="f-tipo" value="${esc(p.tipo)}" list="dl-tipo"></label>
     <label style="flex-direction:row;align-items:center;gap:8px;align-self:end"><input type="checkbox" id="f-coffito" ${p.coffito?'checked':''} style="width:auto"> Conduzido com apoio do COFFITO</label>
     ${p.demanda?`<label class="full">Justificativa da demanda (PCA)<textarea id="f-demanda">${esc(p.demanda)}</textarea></label>`:''}
     <label class="full">Observações<textarea id="f-obs">${esc(p.obs)}</textarea></label>
     <div class="full"><b style="font-size:12px;color:var(--muted)">Gestor e fiscal</b><div id="eq" style="margin-top:6px"></div>
      <button class="btn sm" type="button" id="addEq">+ Adicionar pessoa</button></div>
     <div class="full" style="display:flex;gap:8px;justify-content:flex-end">${id&&S.write?'<button class="btn perigo" type="button" id="delProc">Excluir processo</button>':''}
      <span id="fmsg" class="muted" style="margin-right:auto;align-self:center"></span>
      <button class="btn pri" type="submit" ${S.write?'':'disabled'}>${id?'Salvar alterações':'Cadastrar processo'}</button></div>
    </form>
    <datalist id="dl-pess">${nomes.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <datalist id="dl-tipo"><option value="Aquisição"><option value="Serviço"><option value="Execução Continuada"><option value="Eventos"><option value="Curso/Capacitação"></datalist>
   </section>
   <div id="fdyn"></div>`);
  let eq=(p.equipe||[]).map(e=>({...e}));
  const drawEq=()=>{$('#eq').innerHTML=eq.map((e,i)=>`<div class="eqrow"><input aria-label="Nome" data-i="${i}" data-k="nome" value="${esc(e.nome)}" list="dl-pess" placeholder="Nome (vazio = pendente)">
    <select aria-label="Papel" data-i="${i}" data-k="papel"><option ${e.papel==='Gestor'?'selected':''}>Gestor</option><option ${e.papel==='Fiscal'?'selected':''}>Fiscal</option></select>
    <button class="btn sm" type="button" data-rm="${i}" aria-label="Remover">✕</button></div>${e.obs?`<div class="muted" style="font-size:12px;margin:-2px 0 8px">${esc(e.obs)}</div>`:''}`).join('')||'<span class="muted">Ninguém designado.</span>'};
  drawEq();
  $('#eq').oninput=e=>{const t=e.target;if(t.dataset.i)eq[+t.dataset.i][t.dataset.k]=t.value};
  $('#eq').onclick=e=>{const r=e.target.closest('[data-rm]');if(r){eq.splice(+r.dataset.rm,1);drawEq()}};
  $('#addEq').onclick=()=>{eq.push({nome:'',papel:eq.some(x=>x.papel==='Gestor')?'Fiscal':'Gestor',obs:''});drawEq()};
  $('#fp').onsubmit=async e=>{e.preventDefault();
    const v=k=>$('#f-'+k)?.value.trim()??'';
    const patch={objeto:v('objeto'),sei:v('sei'),fase:v('fase'),urgencia:v('urgencia'),setor:v('setor'),tipo:v('tipo'),obs:v('obs'),
      pca:{s:true,n:false}[v('pca')]??null,coffito:$('#f-coffito').checked,equipe:eq.map(x=>({nome:x.nome.trim(),papel:x.papel,obs:x.obs||''}))};
    if($('#f-demanda'))patch.demanda=v('demanda');
    if(!id){if(!patch.objeto){$('#fmsg').textContent='Informe o objeto do processo.';$('#f-objeto').focus();return}
      try{const nid=await criar('processos',{...NOVO_PROC(),...patch});abrirFicha(nid)}catch(er){$('#fmsg').textContent='Não foi possível cadastrar ('+(er.message||er.code)+').'}
      return}
    const cur=S.proc.get(id),mud=[];
    for(const k of Object.keys(patch))if(JSON.stringify(patch[k])!==JSON.stringify(cur[k]??(k==='pca'?null:k==='equipe'?[]:k==='coffito'?false:'')))mud.push(k);
    if(!mud.length){$('#fmsg').textContent='Nada mudou.';return}
    const nomesC={objeto:'objeto',sei:'SEI',fase:'fase',setor:'setor',tipo:'tipo',obs:'observações',pca:'PCA',coffito:'COFFITO',equipe:'gestor/fiscal',demanda:'demanda',urgencia:'urgência'};
    const txt=mud.includes('fase')?`Fase: ${FNOME[cur.fase]} → ${FNOME[patch.fase]}`+(mud.length>1?'; também '+mud.filter(k=>k!=='fase').map(k=>nomesC[k]).join(', '):''):'Alterado: '+mud.map(k=>nomesC[k]).join(', ');
    if(await upd('processos',id,patch,txt))$('#fmsg').textContent='Salvo.';
  };
  if($('#delProc'))$('#delProc').onclick=async()=>{
    const nt=[...S.tar.values()].filter(x=>x.processo===id).length,nc=[...S.contr.values()].filter(x=>x.processo===id).length;
    const ok=await confirmar({titulo:'Tem certeza que quer excluir este processo?',
      texto:`"${p.objeto}" sai do fluxo de processos, da tabela e dos indicadores.${nt||nc?` As ${nt} tarefa(s) e ${nc} contrato(s) ligados a ele continuam no sistema, sem o vínculo.`:''} Não é possível desfazer pela tela.`,
      botao:'Sim, excluir processo'});
    if(!ok)return;
    try{await apagar('processos',id);fechar()}catch(er){$('#fmsg').textContent='Não foi possível excluir ('+(er.message||er.code)+').'}};
  if(!id)setTimeout(()=>$('#f-objeto')?.focus(),50);
  renderFichaDyn();
}
function renderFichaDyn(){
  const F=S.ficha;if(!F)return;
  if(F.tipo!=='proc')return;
  if(!F.id){$('#fdyn-top').innerHTML='';$('#fdyn').innerHTML='<section class="muted small">Depois de cadastrar, aqui aparecem os contratos, as tarefas e o histórico do processo.</section>';return}
  const p=S.proc.get(F.id);if(!p){fechar();return}
  const cs=[...S.contr.values()].filter(c=>c.processo===p.id);
  const ts=[...S.tar.values()].filter(t=>t.processo===p.id);
  $('#fdyn-top').innerHTML=`<div class="chips"><span class="chip acc">${esc(FNOME[faseDe(p)]||p.fase)}</span>${p.setor?`<span class="chip">${esc(p.setor)}</span>`:''}</div>`;
  $('#fdyn').innerHTML=`
   ${(p.alertas||[]).length?`<section><h4>Pendências a conferir</h4><ul class="list">${p.alertas.map((a,i)=>`<li><span>⚠ ${esc(a)}</span><button class="btn sm" type="button" data-res="${i}" ${S.write?'':'disabled'}>Resolvido</button></li>`).join('')}</ul></section>`:''}
   <section><h4>Contratos</h4>${cs.length?`<ul class="list">${cs.map(c=>{const st=contrStatus(c);return `<li><span><b>${esc(c.empresa||'Empresa a definir')}</b><br><span class="muted">${esc(c.objeto)} · vigência ${br(c.vigencia)}</span></span><span class="chip ${st[1]}">${esc(st[0])}</span></li>`}).join('')}</ul>`:'<span class="muted">Nenhum contrato vinculado.</span>'}</section>
   <section><h4>Tarefas</h4>${ts.map(taskHTML).join('')||'<span class="muted">Nenhuma tarefa.</span>'}
    <div style="margin-top:8px"><button class="btn sm" type="button" id="tNova">+ Tarefa para este processo</button></div></section>
   <section><h4>Histórico</h4>
    <form id="fn" style="display:flex;gap:6px;margin-bottom:10px"><input id="nota" placeholder="Registrar andamento (ex.: enviado à PROJUR)" style="flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"><button class="btn" ${S.write?'':'disabled'}>Registrar</button></form>
    <ul class="list hist">${[...(p.historico||[])].reverse().map(h=>`<li><span>${esc(h.texto)}</span><small>${new Date(h.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})} · ${esc(quem(h.por))}</small></li>`).join('')||'<li class="muted">Sem registros desde a importação.</li>'}</ul></section>
   <section><h4>De onde vieram estes dados</h4><ul class="list">${(p.fontes||[]).map(f=>`<li><span>${esc(f.planilha)} <span class="muted">(${esc(f.data)})</span></span><span class="muted">${esc(f.status)}</span></li>`).join('')||'<li class="muted">Cadastrado diretamente nesta ferramenta.</li>'}</ul></section>`;
  const d=$('#fdyn');
  d.onclick=e=>{const r=e.target.closest('[data-res]');
    if(r){const al=[...p.alertas];const [a]=al.splice(+r.dataset.res,1);upd('processos',p.id,{alertas:al},'Pendência resolvida: '+a,'pendencia');return}
    if(e.target.id==='tNova'){novaTarefa(p.id);return}
    taskClick(e)};
  $('#fn').onsubmit=async e=>{e.preventDefault();const t=$('#nota').value.trim();if(!t)return;if(await upd('processos',p.id,{},t,'andamento'))$('#nota').value=''};
}

/* ---------- contrato e tarefa ---------- */
function abrirContrato(id){
  const c=S.contr.get(id);if(!c)return;S.ficha={tipo:'contr',id};const p=S.proc.get(c.processo);
  shell(`<button class="btn sm close" type="button">Fechar</button><span class="sei">${esc(c.sei)}</span><h2>${esc(c.objeto)}</h2>
   <section><h4>Contrato</h4><form class="form" id="fc">
    <label class="full">Empresa contratada<input id="c-empresa" value="${esc(c.empresa)}"></label>
    <label>Vigência (data final)<input type="date" id="c-vigencia" value="${esc(c.vigencia||'')}"></label>
    <label>Continuidade<select id="c-continuidade">${['Em execução','Renovação Contratual','Novo Contrato','Em Processo','ATENÇÃO','Encerrado'].map(v=>`<option ${v===c.continuidade?'selected':''}>${v}</option>`).join('')}</select></label>
    <label class="full">Situação e próximos passos<textarea id="c-situacao">${esc(c.situacao)}</textarea></label>
    <div class="full" style="display:flex;gap:8px;align-items:center"><span id="cmsg" class="muted" style="margin-right:auto"></span>
     ${p?`<button class="btn" type="button" id="verP">Abrir processo</button>`:''}<button class="btn pri" ${S.write?'':'disabled'}>Salvar</button></div></form></section>`);
  if(p)$('#verP').onclick=()=>abrirFicha(p.id);
  $('#fc').onsubmit=async e=>{e.preventDefault();const v=k=>$('#c-'+k).value.trim();
    const patch={empresa:v('empresa'),vigencia:v('vigencia')||null,continuidade:v('continuidade'),situacao:v('situacao')};
    if(await upd('contratos',id,patch,'Contrato atualizado: '+(c.objeto||''),'contrato')){$('#cmsg').textContent='Salvo.';
      if(p&&c.vigencia!==patch.vigencia)upd('processos',p.id,{},`Vigência do contrato (${c.empresa||c.objeto}): ${br(c.vigencia)} → ${br(patch.vigencia)}`,'registro')}};
}
function abrirTarefa(id,novo){
  const t=id?S.tar.get(id):novo;if(!t)return;S.ficha={tipo:'tar',id:id||null};
  const pv=S.proc.get(t.processo);
  shell(`<button class="btn sm close" type="button">Fechar</button><span class="sei">${id?esc(t.responsavel||'Sem responsável'):pv?'Para o processo: '+esc(pv.objeto):'Preencha e clique em "Criar tarefa"'}</span><h2>${id?esc(t.titulo):'Nova tarefa'}</h2>
   <section><h4>Tarefa</h4><form class="form" id="ft">
    <label class="full">Título<input id="t-titulo" value="${esc(t.titulo)}" required placeholder="Ex.: Pedir parecer à PROJUR"></label>
    <label>Responsável<input id="t-responsavel" value="${esc(t.responsavel)}" list="dl-resp2"></label>
    <label>Prazo<input type="date" id="t-prazo" value="${esc(t.prazo||'')}"></label>
    <label class="full">Ação a fazer<textarea id="t-acao">${esc(t.acao)}</textarea></label>
    <label class="full">Anotações<textarea id="t-notas">${esc(t.notas)}</textarea></label>
    <div class="full" style="display:flex;gap:8px;align-items:center"><span id="tmsg" class="muted" style="margin-right:auto"></span>
     ${t.processo&&S.proc.has(t.processo)?'<button class="btn" type="button" id="verP">Abrir processo</button>':''}<button class="btn pri" ${S.write?'':'disabled'}>${id?'Salvar':'Criar tarefa'}</button></div></form>
    <datalist id="dl-resp2">${nomesEquipe().map(r=>`<option value="${esc(r)}">`).join('')}</datalist></section>
   <section><h4>Histórico</h4><ul class="list hist">${[...(t.historico||[])].reverse().map(h=>`<li><span>${esc(h.texto)}</span><small>${new Date(h.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})} · ${esc(quem(h.por))}</small></li>`).join('')||'<li class="muted">Sem registros desde a importação. Mudanças de prazo passam a ficar registradas aqui.</li>'}</ul></section>`);
  if($('#verP'))$('#verP').onclick=()=>abrirFicha(t.processo);
  $('#ft').onsubmit=async e=>{e.preventDefault();const v=k=>$('#t-'+k).value.trim();
    const patch={titulo:v('titulo'),responsavel:v('responsavel'),prazo:v('prazo')||null,acao:v('acao'),notas:v('notas')};
    if(!id){if(!patch.titulo){$('#tmsg').textContent='Informe o título da tarefa.';return}
      try{const nid=await criar('tarefas',{...patch,status:'andamento',processo:t.processo||'',sei:t.sei||''});abrirTarefa(nid)}catch(er){$('#tmsg').textContent='Não foi possível criar ('+(er.message||er.code)+').'}
      return}
    const ms=[];if(patch.prazo!==t.prazo)ms.push(`Prazo: ${br(t.prazo)} → ${br(patch.prazo)}`);
    if(patch.responsavel!==t.responsavel)ms.push(`Responsável: ${t.responsavel||'—'} → ${patch.responsavel||'—'}`);
    if(['titulo','acao','notas'].some(k=>patch[k]!==(t[k]||'')))ms.push('Descrição atualizada');
    if(!ms.length){$('#tmsg').textContent='Nada mudou.';return}
    if(await upd('tarefas',id,patch,ms.join('; '))){$('#tmsg').textContent='Salvo.';abrirTarefa(id)}};
}
async function novaTarefa(proc){
  if(!S.write)return note('Sem permissão para editar.');
  const p=S.proc.get(proc);
  abrirTarefa(null,{titulo:'',acao:'',responsavel:S.meuNome||'',prazo:null,status:'andamento',notas:'',processo:proc||'',sei:p?.sei||'',historico:[]});
}
$('#novoProc').onclick=()=>{if(!S.write)return note('Sem permissão para editar.');abrirFicha(null,NOVO_PROC())};
$('#xlsTudo').onclick=()=>exportar(true);
$('#attn').onclick=e=>{const b=e.target.closest('[data-go]');if(!b)return;const g=b.dataset.go;
  if(g==='pend'){S.pend=true;S.q='';if(location.hash!=='#quadro')location.hash='#quadro';else vQuadro()}else location.hash='#'+g};
boot();
</script>
</body>
