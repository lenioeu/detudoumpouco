<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SELIC-15</title>
<meta name="description" content="SELIC-15 · gestão de processos, contratos e tarefas do Setor de Licitações e Contratos do CREFITO-15">
<meta name="author" content="Lenio Goularte">
<link rel="icon" href="/img/globo-32.png">
<link rel="apple-touch-icon" href="/img/globo-180.png">
<meta name="theme-color" content="#132717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* SELIC-15 · identidade visual CREFITO-15 (manual de marca: verdes #132717 #48AE75 #92CFA0, Acumin Pro) */
:root{
  --bg:#f5f8f6; --surface:#ffffff; --sunk:#edf2ee; --ink:#132717; --muted:#55625a; --line:#d6dfd8;
  --accent:#237047; --accent-soft:#e4f3e9; --on-accent:#ffffff;
  --brand:#48ae75; --brand-light:#92cfa0; --brand-dark:#132717;
  --ok:#237047; --ok-soft:#e4f3e9; --warn:#9a5b00; --warn-soft:#fbeccf; --crit:#b3261e; --crit-soft:#f8dcd9;
  --s-ok:#2f8a57; --s-and:#2f5fa8; --s-nao:#c27a00; --s-can:#8a4fb8;
  --serif:"Acumin Pro",Archivo,"Segoe UI",system-ui,sans-serif;
  --sans:"Acumin Pro",Archivo,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(19,39,23,.08),0 2px 8px rgba(19,39,23,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand h1{font:600 22px/1.1 var(--serif);margin:0;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px}
nav.tabs a{padding:8px 14px;border-radius:var(--r) var(--r) 0 0;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a .n{font-size:11px;background:var(--sunk);border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding-block:14px}
.attn button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;border-left-width:4px}
.attn button b{font:600 24px/1 var(--serif)}
.attn button span{font-size:12px;color:var(--muted)}
.attn .crit{border-left-color:var(--crit)} .attn .crit b{color:var(--crit)}
.attn .warn{border-left-color:var(--warn)} .attn .warn b{color:var(--warn)}
.attn .info{border-left-color:var(--accent)}
.notice{margin-block:10px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
main{padding-block:4px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 220px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.bar select{padding:7px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.bar label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
/* quadro */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 272px;background:var(--sunk);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 260px);min-height:120px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{font:600 13px/1.2 var(--sans);margin:0;padding:12px 12px 8px;display:flex;justify-content:space-between;gap:8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.col h3 small{font-weight:500;text-transform:none;letter-spacing:0}
.col .cards{overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px}
.col.fold .cards{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .obj{font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sei{font:12px var(--mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.foldbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12px;padding:0 12px 10px;text-align:left}
/* tabelas */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
td.num{text-align:right;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:13px}
/* tarefas */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.group h3{margin:0;padding:12px 14px;font:600 17px var(--serif);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.group h3 small{font:12px var(--sans);color:var(--muted)}
.task{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.task:last-child{border-bottom:0}
.task .t{font-weight:600}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
/* equipe */
.person .row{display:flex;justify-content:space-between;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.person .row:hover{background:var(--accent-soft)}
.person .row:last-child{border-bottom:0}
.person .row .chip{flex-shrink:0;align-self:flex-start;max-width:50%;overflow:hidden;text-overflow:ellipsis}
/* ficha */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.2);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 20px}
.drawer h2{font:600 22px/1.2 var(--serif);margin:4px 0 6px;text-wrap:balance}
.drawer section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.drawer section>h4{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px;min-width:0;width:100%}
.form textarea{min-height:90px;resize:vertical}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.hist li{flex-direction:column;gap:0;border-left:2px solid var(--line);padding-left:10px}
.hist small{color:var(--muted);font-size:12px}
.eqrow{display:grid;grid-template-columns:1fr 110px auto;gap:6px;margin-bottom:6px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.close{float:right}
.pre{white-space:pre-wrap}
.muted{color:var(--muted)}
/* tabela */
th.sort{cursor:pointer;user-select:none;white-space:nowrap}
th.sort:hover{color:var(--ink)}
th.sort[aria-sort]::after{content:" ▲";font-size:9px}
th.sort[aria-sort="descending"]::after{content:" ▼"}
.tbl.tall{max-height:calc(100vh - 300px);overflow:auto}
.tbl.tall table{min-width:1100px}
/* calendário */
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calhead h2{font:600 22px var(--serif);margin:0 auto 0 0;min-width:180px}
.callayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:980px){.callayout{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dow{background:var(--sunk);padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.cal .day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;text-align:left;border:0;font:inherit;color:inherit}
.cal .day.out{background:var(--sunk);color:var(--muted)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .day .dn{font-size:12px;font-weight:600}
.cal .day.hoje .dn{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 7px;align-self:flex-start}
.ev{font-size:11px;line-height:1.3;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid;background:var(--sunk)}
.ev.tarefa{border-color:var(--accent)} .ev.atraso{border-color:var(--crit);background:var(--crit-soft)}
.ev.vigencia{border-color:var(--crit)} .ev.alerta{border-color:var(--warn);background:var(--warn-soft)}
.ev.agenda{border-color:var(--ok);background:var(--ok-soft)} .ev.feito{opacity:.55;text-decoration:line-through}
.evmore{font-size:11px;color:var(--muted)}
@media (max-width:640px){.cal .day{min-height:56px}.cal .day .ev{font-size:0;height:6px;padding:0;border-left-width:0}.cal .dow{padding:4px;font-size:10px}}
.daylist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.daylist h3{font:600 17px var(--serif);margin:0 0 10px}
.daylist .it{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:6px;border-left:3px solid}
.daylist .it:hover{filter:brightness(.97)}
.daylist .it small{color:var(--muted)}
.calleg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.calleg span{display:inline-flex;gap:6px;align-items:center}
.calleg i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* painel PCA */
.hero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.hero .big{font:600 56px/1 var(--serif)}
.hero .big small{font-size:24px}
.hero p{margin:6px 0 0;color:var(--muted)}
.stack{display:flex;gap:2px;height:18px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%;min-width:2px}
.legendp{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px}
.legendp span{display:inline-flex;align-items:center;gap:6px}
.legendp i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legendp b{font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px;align-items:start}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.pbox h3{font:600 17px var(--serif);margin:0 0 4px}
.pbox>p{margin:0 0 12px;color:var(--muted);font-size:13px}
.srow{display:grid;grid-template-columns:130px minmax(0,1fr) 36px;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}
.srow .stack{height:14px}
.srow .tot{text-align:right;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.plist li:last-child{border-bottom:0}
.plist li .chip{flex-shrink:0;align-self:flex-start;max-width:50%;overflow:hidden;text-overflow:ellipsis}
.plist li:hover span:first-child{color:var(--accent)}
.ptip{position:fixed;z-index:30;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:6px;font-size:12px;pointer-events:none}
/* ---- identidade CREFITO-15 ---- */
header{border-top:4px solid var(--brand)}
.top{padding-block:10px 0}
.brand{display:flex;flex-direction:row;align-items:center;gap:14px;margin-right:auto;text-decoration:none;color:inherit;min-width:0}
.brand img{height:52px;width:auto;display:block}
.brand .sys{font-size:inherit;color:inherit}
.sys{border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:2px}
.sys b{font:700 22px/1 var(--serif);letter-spacing:.02em;color:var(--brand-dark)}
.sys small{font-size:12px;color:var(--muted)}
.user{font-size:13px;color:var(--muted)}
.linklike{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn.pri{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.btn.pri:hover{background:#21402a}
nav.tabs a[aria-current="page"]{border-bottom:3px solid var(--brand);color:var(--brand-dark)}
h1,h2,h3{font-family:var(--serif)}
.small{font-size:12px}
.toast{display:flex;align-items:center;gap:10px;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--brand-dark);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:40;box-shadow:0 6px 20px rgba(19,39,23,.3)}
@media (max-width:640px){.sys small,.user{display:none}.brand img{height:44px}#xlsTudo{font-size:12px;padding:6px 8px}}
/* ---- painel ---- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0;grid-column:span 12}
.card h2{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--brand-dark)}
.card.saude{grid-column:span 12}.card.half{grid-column:span 6}
@media (max-width:900px){.card.half{grid-column:span 12}}
.saude-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.saude-txt{flex:1;min-width:200px}.saude-txt p{margin:4px 0 8px;color:var(--muted);font-size:13px}
.gauge{width:128px;height:128px;flex:none}
.g-bg{fill:none;stroke:var(--sunk);stroke-width:12}.g-fg{fill:none;stroke:var(--brand);stroke-width:12;stroke-linecap:round}
.saude.aten .g-fg{stroke:var(--crit)}.saude.evo .g-fg{stroke:var(--warn)}.saude.ex .g-fg{stroke:var(--brand-dark)}
.g-num{font:700 34px var(--serif);fill:var(--ink)}.g-sub{font-size:11px;fill:var(--muted)}
.lvl{font:700 20px var(--serif)}.saude.aten .lvl{color:var(--crit)}.saude.evo .lvl{color:var(--warn)}.saude.bom .lvl,.saude.ex .lvl{color:var(--accent)}
.spark{width:100%;max-width:320px;height:56px;display:block}
.sp-line{fill:none;stroke:var(--brand-dark);stroke-width:2;stroke-linejoin:round}.sp-area{fill:var(--accent-soft)}.sp-ref{stroke:var(--line);stroke-dasharray:3 3}.sp-dot{fill:var(--brand-dark);stroke:var(--surface);stroke-width:2}
.comp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;flex:1 1 340px;min-width:0}
.comp li{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,140px) 42px;gap:10px;align-items:center;font-size:13px}
.comp small{color:var(--muted)}.comp b{text-align:right}
.mbar{display:block;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.mbar.lg{height:12px;margin:12px 0 6px}
.big{font:700 40px/1.05 var(--serif);color:var(--brand-dark)}.big small{font-size:16px;font-weight:500;color:var(--muted)}
.metas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.card-head h2{margin:0 auto 0 0}
.meta{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.meta:hover{border-color:var(--brand)}.meta.arq{opacity:.6}
.meta .mt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:14px}
.meta.ok .mbar i{background:var(--brand-dark)}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.feed li:last-child{border-bottom:0}
.fr{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
/* ---- linha do tempo ---- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand-dark);color:#fff}
.tl-leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-left:auto}.tl-leg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:8px;border-radius:4px;display:inline-block}
.win-sw,.win{background:var(--s-nao);background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.35) 3px 5px)}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 0 4px}
.tl-scroll{overflow-x:auto}.tl-inner{min-width:760px}
.tl-row{display:grid;grid-template-columns:260px 1fr;align-items:center;min-height:40px;border-bottom:1px solid var(--sunk);cursor:pointer}
.tl-row.axis{cursor:default}.tl-row:last-child{border-bottom:0}.tl-row:not(.axis):hover{background:var(--accent-soft)}
.tl-row .lbl{padding:6px 12px 6px 14px;min-width:0}
.tl-row .lbl b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row .lbl small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:40px;margin-right:16px}.axis .track{height:44px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--sunk)}.tick span{position:absolute;top:6px;left:4px;font-size:11px;color:var(--muted);white-space:nowrap}
.gridl{position:absolute;top:0;bottom:0;border-left:1px solid var(--sunk)}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--brand-dark);z-index:2;pointer-events:none}
.today span{position:absolute;top:24px;left:4px;font-size:11px;font-weight:600;color:var(--brand-dark);background:var(--surface);padding:0 3px;white-space:nowrap}
.tbar{position:absolute;top:15px;height:10px;border-radius:0 5px 5px 0;background:var(--s-and)}
.win{position:absolute;top:15px;height:10px;border-radius:0 5px 5px 0}
.end{position:absolute;top:12px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--s-and);z-index:1}.end.w{border-color:var(--s-nao)}
.more{position:absolute;right:0;top:12px;font-size:11px;color:var(--muted);background:var(--surface);padding-left:4px}
.late{position:absolute;left:0;top:10px;font-size:12px;font-weight:600;color:var(--crit);background:var(--crit-soft);border-radius:4px;padding:2px 8px;white-space:nowrap;z-index:3}
.nod{position:absolute;top:19px;height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 6px,transparent 6px 11px)}
.nodb{position:absolute;top:10px;font-size:12px;font-weight:600;background:var(--warn-soft);border:1px dashed var(--warn);border-radius:4px;padding:1px 8px;white-space:nowrap;z-index:3}
.grp{padding:8px 14px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--sunk);background:var(--sunk)}
@media (max-width:700px){.tl-row{grid-template-columns:150px 1fr}.tl-inner{min-width:640px}.tl-leg{margin-left:0}}
/* ---- urgência ---- */
:root{--u-baixa:#2f8a57;--u-media:#e0a800;--u-urgente:#c62828}
.card.u-baixa{border-left:5px solid var(--u-baixa)}.card.u-media{border-left:5px solid var(--u-media)}.card.u-urgente{border-left:5px solid var(--u-urgente);background:#fff8f7}
.chip.u-baixa{background:#e3f4ea;color:#1d6b3f;font-weight:600}.chip.u-media{background:#fff3c4;color:#6b4e00;font-weight:600}.chip.u-urgente{background:#fbe0de;color:#a11d1d;font-weight:600}
.card>.chip{align-self:flex-start}
.urg-leg{display:inline-flex;align-items:center;gap:4px}.urg-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px}
.urg-leg i.u-baixa{background:var(--u-baixa)}.urg-leg i.u-media{background:var(--u-media)}.urg-leg i.u-urgente{background:var(--u-urgente)}
/* ---- barras horizontais ---- */
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.hb{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 38px;gap:10px;align-items:center;font-size:13px}
.hb-click{cursor:pointer}.hb-click:hover .hb-l{color:var(--accent);text-decoration:underline}
.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb-t{display:block;height:16px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hb-f{display:flex;gap:2px;height:100%;min-width:2px}.hb-f i{display:block;height:100%;min-width:3px}.hb-f i:last-child{border-radius:0 4px 4px 0}
.hb-v{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.hb{grid-template-columns:110px minmax(0,1fr) 32px}}
/* ---- indicadores ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.kpi{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi>div{display:flex;flex-direction:column;gap:2px;min-width:0}.kpi b{font-size:14px}.kpi small{font-size:12px}
.fx{font-weight:700;font-size:13px}.kpi.aten .fx{color:var(--crit)}.kpi.evo .fx{color:var(--warn)}.kpi.bom .fx,.kpi.ex .fx{color:var(--accent)}
.anel{width:76px;height:76px;flex:none}.anel.aten .g-fg{stroke:var(--crit)}.anel.evo .g-fg{stroke:var(--warn)}.anel.ex .g-fg{stroke:var(--brand-dark)}
.anel .g-bg,.anel .g-fg{stroke-width:9}.a-num{font:700 16px var(--serif);fill:var(--ink)}
.dl{font-size:12px;font-weight:600}.dl.up{color:var(--accent)}.dl.down{color:var(--crit)}
.trend{width:100%;height:auto;max-height:240px;display:block}.trend .gr{stroke:var(--sunk)}.trend .ax{font-size:11px;fill:var(--muted)}.trend .hit{fill:transparent;cursor:pointer}
/* ---- configurações ---- */
.cfg{display:flex;flex-direction:column;gap:14px}
.cfg-nav{display:flex;gap:8px;flex-wrap:wrap}.cfg-nav a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px}
.cfgt{min-width:640px}.cfgt td{vertical-align:middle}.cfgt input:not([type=checkbox]),.cfgt select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;max-width:100%}
.aviso{background:var(--warn-soft);border:1px solid #f0d49a;border-radius:8px;padding:10px 12px;margin-bottom:10px}
.niveis{margin:0 0 10px;padding-left:18px;color:var(--muted)}
.aviso.ok-box{background:var(--ok-soft);border-color:var(--brand-light)}
@media (max-width:700px){#fusr{grid-template-columns:1fr!important}}
/* ---- aprovação de acesso ---- */
.btn.sair{text-decoration:none;color:var(--muted)}.btn.sair:hover{color:var(--crit);border-color:var(--crit)}
body.espera nav.tabs,body.espera #attn,body.espera #novoProc,body.espera #xlsTudo,body.espera .user{display:none!important}
.espera-card{max-width:560px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.espera-card h2{margin:8px 0 0;font-size:22px}.espera-card p{color:var(--muted);margin:0}.espera-card .form{width:100%}
nav.tabs a .n.alerta{background:var(--crit);color:#fff}
.aviso-pend{background:var(--warn-soft);border-color:#f0d49a}.aviso-pend a{color:var(--accent);font-weight:600}
tr.pend td{background:var(--warn-soft)}
/* ---- pizzas e setores ---- */
.pizzas{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.pizza{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:18px;align-items:start}
.pizza h3{grid-column:1/-1;margin:0 0 8px;font-size:15px;color:var(--brand-dark)}.pz{width:200px;height:200px}
.fatia{stroke:var(--surface);stroke-width:2;cursor:pointer}.fatia:hover{opacity:.85}
.pz-leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pz-leg li{display:grid;grid-template-columns:12px minmax(0,1fr) 40px 28px;gap:8px;align-items:center}
.pz-leg i{width:12px;height:12px;border-radius:3px}.pz-leg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pz-leg b,.pz-leg small{text-align:right}.pz-leg small{color:var(--muted)}
@media (max-width:560px){.pizza{grid-template-columns:1fr}.pz{margin:0 auto 10px}}
.setores{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px}
.setores li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.setores li:last-child{border-bottom:0}
/* ---- avisos e confirmações ---- */
.toast .tbtn{margin-left:6px;background:transparent;border:1px solid var(--brand-light);color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;cursor:pointer}
.toast .tbtn:hover,.toast .tbtn:focus-visible{background:var(--brand);color:var(--brand-dark);outline:none}.toast .tbtn:disabled{opacity:.7;cursor:default}
.toast{z-index:60}.toast .tk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brand);color:var(--brand-dark);font-size:12px;font-weight:800}
.confirma{position:fixed;inset:0;background:rgba(10,20,22,.5);z-index:50;display:grid;place-items:center;padding:16px}
.confirma-box{background:var(--surface);border-radius:14px;max-width:460px;width:100%;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.25);border-top:4px solid var(--crit)}
.confirma-box h3{margin:0 0 8px;font-size:18px;color:var(--brand-dark)}.confirma-box p{margin:0 0 18px;color:var(--muted)}
.confirma-acoes{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.btn.perigo{color:var(--crit);border-color:#e7b9b5}.btn.perigo:hover{background:var(--crit-soft);border-color:var(--crit)}
.btn.perigo-pri{background:var(--crit);border-color:var(--crit);color:#fff}.btn.perigo-pri:hover{background:#951f18}
@media (prefers-reduced-motion:no-preference){.toast.in{animation:tin .22s ease-out}@keyframes tin{from{transform:translate(-50%,12px);opacity:0}}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<body>

<header>
  <div class="wrap top">
    <a class="brand" href="#painel" aria-label="SELIC-15, início"><img src="/img/crefito15-horizontal-reduzida.png" alt="CREFITO-15" width="121" height="52">
      <span class="sys"><b>SELIC-15</b><small>Setor de Licitações e Contratos</small></span></a>
    <span class="user">Olá, <button id="quem" class="linklike" type="button" title="Alterar como seu nome aparece">…</button></span>
    <a class="btn sair" id="sair" href="/cdn-cgi/access/logout" title="Encerrar a sessão neste navegador">Sair</a>
    <button class="btn" id="xlsTudo" type="button" title="Baixa um Excel com todas as informações do sistema">Exportar tudo (Excel)</button>
    <button class="btn pri" id="novoProc" type="button">+ Novo processo</button>
  </div>
  <nav class="tabs wrap" id="tabs" aria-label="Vistas">
    <a href="#painel" data-v="painel">Painel</a>
    <a href="#quadro" data-v="quadro">Fluxo de processos<span class="n" id="n-quadro">–</span></a>
    <a href="#tarefas" data-v="tarefas">Tarefas da equipe<span class="n" id="n-tarefas">–</span></a>
    <a href="#tabela" data-v="tabela">Tabela</a>
    <a href="#contratos" data-v="contratos">Contratos<span class="n" id="n-contratos">–</span></a>
    <a href="#linha" data-v="linha">Linha do tempo</a>
    <a href="#calendario" data-v="calendario">Calendário</a>
    <a href="#equipe" data-v="equipe">Gestores e fiscais<span class="n" id="n-equipe">–</span></a>
    <a href="#parcerias" data-v="parcerias">Parcerias</a>
    <a href="#pca" data-v="pca">Painel do PCA</a>
    <a href="#config" data-v="config" id="tab-config" hidden>Configurações</a>
    <a href="#indicadores" data-v="indicadores">Indicadores</a>
  </nav>
</header>
<div class="wrap">
  <div id="notice" class="notice" hidden></div>
  <div class="attn" id="attn" aria-label="Atenção hoje"></div>
</div>
<main class="wrap" id="main"><div class="empty">Carregando os processos, contratos e tarefas do setor…</div></main>
<div id="ficha" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const COLUNAS_PADRAO=[
 {id:'previsto',nome:'Previsto no PCA',etapa:'nao_iniciado'},{id:'planejamento',nome:'Planejamento (DFD, ETP, TR)',etapa:'andamento'},
 {id:'juridico',nome:'Jurídico (PROJUR)',etapa:'andamento'},{id:'selecao',nome:'Seleção do fornecedor',etapa:'andamento',designacao:true},
 {id:'contratacao',nome:'Contratação / assinatura',etapa:'andamento',designacao:true},{id:'execucao',nome:'Em execução',etapa:'execucao',designacao:true},
 {id:'finalizado',nome:'Finalizado',etapa:'concluido'},{id:'encerrado',nome:'Deserto, fracassado ou cancelado',etapa:'encerrado'}];
const ETAPAS={nao_iniciado:'Não iniciado',andamento:'Em andamento',execucao:'Em execução',concluido:'Concluído',encerrado:'Encerrado (deserto, fracassado ou cancelado)'};
let COLUNAS=COLUNAS_PADRAO,FASES=[],FNOME={},CMETA={};
function aplicarConfig(){const q=S.config.get('quadro');COLUNAS=q?.colunas?.length?q.colunas:COLUNAS_PADRAO;
  FASES=COLUNAS.map(c=>[c.id,c.nome]);FNOME=Object.fromEntries(FASES);CMETA=Object.fromEntries(COLUNAS.map(c=>[c.id,c]))}
const SETORES_PADRAO=['DIRETORIA','PRESIDÊNCIA','SEFIN','SELIC'];
const SETORES=()=>{const l=S.config.get('setores')?.lista;return Array.isArray(l)?l:SETORES_PADRAO};
const JANELA=()=>+(S.config.get('parametros')?.janela)||120;
const faseDe=p=>CMETA[p.fase]?p.fase:COLUNAS[0].id;
const etapa=f=>(CMETA[f]||CMETA[COLUNAS[0].id])?.etapa||'nao_iniciado';
const exigeDesig=f=>!!CMETA[f]?.designacao;
const S={painel:null,meuNome:'',nivel:'editor',usuarios:[],config:new Map(),parcerias:new Map(),pessoas:new Map(),urg:'',metas:new Map(),metasArq:false,proc:new Map(),contr:new Map(),tar:new Map(),agenda:new Map(),ok:{processos:0,contratos:0,tarefas:0,agenda:0},
  tab:{sort:'objeto',dir:1,fase:'',pca:''},cal:null,
  view:'quadro',q:'',setor:'',pend:false,abertas:{},feitas:false,resp:'',
  ficha:null,me:null,write:true,names:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dias=iso=>iso?Math.round((new Date(iso+'T00:00:00')-hoje())/864e5):null;
const br=iso=>iso?iso.split('-').reverse().join('/'):'—';
const agora=()=>new Date().toISOString();
aplicarConfig();
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- dados (API do SELIC-15) ---------- */
const API=async(method,path,body)=>{
  let r;try{r=await fetch('/api'+path,{method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined})}
  catch{throw{code:'rede'}}
  if(r.status===401||r.redirected||!(r.headers.get('content-type')||'').includes('json')){note('Sua sessão expirou. Recarregue a página para entrar de novo.');throw{code:'sessao'}}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw{code:r.status,message:d.erro||''};return d};
const MAPAS={processos:S.proc,contratos:S.contr,tarefas:S.tar,agenda:S.agenda,metas:S.metas,config:S.config,parcerias:S.parcerias,pessoas:S.pessoas};
let since='';
function aplicar(d){const m=MAPAS[d.col];if(!m)return;if(d.deleted)m.delete(d.id);else m.set(d.id,{id:d.id,...d.data})}
async function sync(){
  try{const r=await API('GET','/docs'+(since?'?since='+encodeURIComponent(since):''));
    r.docs.forEach(aplicar);aplicarConfig();const primeira=!since;since=r.agora;
    if(primeira){Object.keys(S.ok).forEach(k=>S.ok[k]=1);$('#notice').hidden=true}
    if(primeira||r.docs.length){schedule();if(!primeira)carregarPainel()}
  }catch(e){if(e.code!=='sessao')note('Sem conexão com o servidor. A página tenta de novo sozinha.')}
}
async function boot(){
  route();
  try{const me=await API('GET','/me');S.me=me.email;S.meuNome=me.nome||'';S.nivel=me.nivel||'pendente';S.write=S.nivel==='admin'||S.nivel==='editor'}catch{}
  if(!['admin','editor','leitor'].includes(S.nivel))return telaEspera();
  $('#tab-config').hidden=S.nivel!=='admin';
  $('#novoProc').hidden=!S.write;
  try{S.usuarios=await API('GET','/usuarios');S.usuarios.forEach(u=>{if(u.nome)S.names[u.email]=u.nome})}catch{}
  marcarPendentes();
  pintarUsuario();await sync();carregarPainel();
  setInterval(()=>{if(!document.hidden)sync()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
}
const pendentes=()=>(S.usuarios||[]).filter(u=>u.nivel==='pendente');
function marcarPendentes(){const n=pendentes().length,a=$('#tab-config');if(!a)return;a.querySelector('.n')?.remove();
  if(S.nivel==='admin'&&n)a.insertAdjacentHTML('beforeend',`<span class="n alerta" title="Aguardando aprovação">${n}</span>`)}
function telaEspera(){
  document.body.classList.add('espera');const bloq=S.nivel==='bloqueado';
  $('#main').innerHTML=`<section class="espera-card"><img src="/img/crefito15-horizontal.png" alt="CREFITO-15" width="300">
   <h2>${bloq?'Acesso não autorizado':'Seu acesso está aguardando aprovação'}</h2>
   <p>${bloq?'Um administrador do SELIC-15 não liberou este e-mail. Se acha que é um engano, fale com o Setor de Licitações e Contratos.'
     :'Você entrou com <b>'+esc(S.me||'')+'</b>. Um administrador do Setor de Licitações e Contratos precisa aprovar seu acesso. Quando isso acontecer, esta página abre o sistema sozinha.'}</p>
   ${bloq?'':`<form id="fesp" class="form" style="grid-template-columns:1fr auto;align-items:end;text-align:left"><label>Seu nome, para o administrador saber quem é você<input id="esp-nome" value="${esc(S.meuNome)}" placeholder="Ex.: Anna Souza" maxlength="80"></label>
    <button class="btn pri">Enviar</button><span id="espmsg" class="muted small full"></span></form>`}</section>`;
  if(bloq)return;
  $('#fesp').onsubmit=async e=>{e.preventDefault();try{await API('PUT','/me',{nome:$('#esp-nome').value.trim()});$('#espmsg').textContent='Obrigado. Seu nome já aparece para o administrador.'}catch{$('#espmsg').textContent='Não foi possível enviar. Tente de novo.'}};
  setInterval(async()=>{try{const me=await API('GET','/me');if(['admin','editor','leitor'].includes(me.nivel))location.reload()}catch{}},30000);
}
function note(m){const n=$('#notice');n.textContent=m;n.hidden=false}
let raf=0;function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}
const quem=e=>!e?'alguém da equipe':S.names[e]||(String(e).includes('@')?String(e).split('@')[0]:e);
const MSG_SALVO={processos:'Processo salvo',contratos:'Contrato salvo',tarefas:'Tarefa salva',agenda:'Evento salvo',metas:'Meta salva',parcerias:'Parceria salva',pessoas:'Dados da pessoa salvos'};
const MSG_ACAO={tarefa_concluida:'Tarefa concluída',reabrir:'Tarefa reaberta',pendencia:'Pendência marcada como resolvida',andamento:'Andamento registrado no histórico',contrato:'Contrato salvo'};
const MSG_CRIADO={processos:'Processo cadastrado',tarefas:'Tarefa criada',agenda:'Evento adicionado à agenda',metas:'Meta criada',parcerias:'Parceria cadastrada',pessoas:'Pessoa adicionada à equipe'};
const MSG_EXCLUIDO={processos:'Processo excluído',agenda:'Evento excluído',metas:'Meta excluída',parcerias:'Parceria excluída',pessoas:'Pessoa excluída da equipe'};
const copia=v=>v===undefined?null:JSON.parse(JSON.stringify(v));
// Depois de desfazer, a ficha aberta daquele item é redesenhada (ou fechada, se o item deixou de existir).
function reabrirSeAberta(col,id){const F=S.ficha;if(!F||F.id!==id)return;const m=MAPAS[col];
  if(!m?.has(id))return fechar();
  ({processos:()=>abrirFicha(id),tarefas:()=>abrirTarefa(id),contratos:()=>abrirContrato(id),agenda:()=>abrirEvento(id),metas:()=>abrirMeta(id),parcerias:()=>abrirParceria(id),pessoas:()=>abrirPessoa(id)})[col]?.()}
async function upd(col,id,patch,texto,acao,silencio){
  const cur=MAPAS[col]?.get(id)||{},antes={};for(const k of Object.keys(patch))antes[k]=copia(cur[k]);
  try{const r=await API('PATCH',`/docs/${col}/${encodeURIComponent(id)}`,{patch,texto:texto||'',acao:acao||'edicao'});
    aplicar(r.doc);schedule();carregarPainel();
    if(!silencio&&acao!=='registro'&&acao!=='desfazer'){
      const novo=texto?(r.doc.data.historico||[]).slice(-1)[0]:null;
      toast(acao==='fase'&&patch.fase?`Processo movido para "${FNOME[patch.fase]||''}"`:MSG_ACAO[acao]||MSG_SALVO[col]||'Alterações salvas',async()=>{
        const d=await API('PATCH',`/docs/${col}/${encodeURIComponent(id)}`,{patch:antes,texto:'',removerHistorico:novo?.em||'',acao:'desfazer'});
        aplicar(d.doc);schedule();carregarPainel();reabrirSeAberta(col,id)})}
    return true}
  catch(e){if(e.code!=='sessao')note('Não foi possível salvar ('+(e.message||e.code)+'). Tente de novo.');return false}
}
async function criar(col,data,silencio){const r=await API('POST','/docs/'+col,{data});aplicar(r.doc);schedule();carregarPainel();const id=r.doc.id;

let toastT=0,toastDesf=null;
function toast(m,desfazer){const t=$('#toast');toastDesf=desfazer||null;
  t.innerHTML='<span class="tk" aria-hidden="true">✓</span>';t.append(document.createTextNode(m));
  if(desfazer){const b=document.createElement('button');b.type='button';b.className='tbtn';b.textContent='Desfazer';
    b.onclick=async()=>{const f=toastDesf;if(!f)return;toastDesf=null;b.disabled=true;b.textContent='Desfazendo…';
      try{await f();toast('Alteração desfeita')}catch(e){t.hidden=true;note('Não foi possível desfazer ('+(e.message||e.code||'erro')+').')}};
    t.append(b)}
  t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');
  const tempo=desfazer?7000:3200,esconder=()=>{clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;toastDesf=null},tempo)};
  t.onmouseenter=()=>clearTimeout(toastT);t.onmouseleave=esconder;t.onfocusin=()=>clearTimeout(toastT);esconder()}
function confirmar({titulo,texto,botao='Confirmar'}){return new Promise(res=>{
  const d=document.createElement('div');d.className='confirma';
  d.innerHTML=`<div class="confirma-box" role="alertdialog" aria-modal="true" aria-labelledby="cf-t" aria-describedby="cf-x"><h3 id="cf-t">${esc(titulo)}</h3><p id="cf-x">${esc(texto)}</p>
    <div class="confirma-acoes"><button class="btn" type="button" data-n>Cancelar</button><button class="btn perigo-pri" type="button" data-s>${esc(botao)}</button></div></div>`;
  document.body.appendChild(d);
  const kd=e=>{if(e.key==='Escape'){e.stopImmediatePropagation();fim(false)}};
  const fim=v=>{d.remove();document.removeEventListener('keydown',kd,true);res(v)};
  document.addEventListener('keydown',kd,true);
  d.querySelector('[data-n]').onclick=()=>fim(false);d.querySelector('[data-s]').onclick=()=>fim(true);d.onclick=e=>{if(e.target===d)fim(false)};

/* ---------- derivados ---------- */
function contrStatus(c){
  const d=dias(c.vigencia);
  if(d===null)return['sem vigência','',99999];
  if(d<0)return['vencido há '+(-d)+' d','crit',d];
  if(d<=30)return['vence em '+d+' d','crit',d];
  if(d<=JANELA())return['vence em '+d+' d','warn',d];
  return['vigente','ok',d];
}
const atrasada=t=>t.status==='andamento'&&t.prazo&&dias(t.prazo)<0;
function contagens(){
  const cs=[...S.contr.values()].map(contrStatus);
  return{venc:cs.filter(x=>x[2]<0).length,v30:cs.filter(x=>x[2]>=0&&x[2]<=30).length,v120:cs.filter(x=>x[2]>30&&x[2]<=JANELA()).length,
    atr:[...S.tar.values()].filter(atrasada).length,pend:[...S.proc.values()].filter(p=>(p.alertas||[]).length).length};
}

  if(S.q){const q=norm(S.q);if(!norm([p.objeto,p.sei,p.setor,p.obs,(p.equipe||[]).map(e=>e.nome).join(' ')].join(' ')).includes(q))return false}

function gauge(v){const r=52,c=2*Math.PI*r,f=Math.max(0,Math.min(100,v))/100;
  return `<svg viewBox="0 0 128 128" class="gauge" role="img" aria-label="Índice de saúde ${v} de 100"><circle cx="64" cy="64" r="${r}" class="g-bg"/>
   <circle cx="64" cy="64" r="${r}" class="g-fg" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 64 64)"/>
   <text x="64" y="70" text-anchor="middle" class="g-num">${v}</text><text x="64" y="90" text-anchor="middle" class="g-sub">de 100</text></svg>`}
function spark(h){if(h.length<2)return '<p class="muted small">A tendência aparece a partir do segundo dia de uso.</p>';
  const W=260,H=56,x=i=>4+i*(W-8)/(h.length-1),y=v=>H-4-(v/100)*(H-8);
  const pts=h.map((d,i)=>`${x(i).toFixed(1)},${y(d.saude).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" role="img" aria-label="Índice nos últimos ${h.length} dias"><line x1="0" x2="${W}" y1="${y(75)}" y2="${y(75)}" class="sp-ref"/>
   <polygon points="${x(0)},${H} ${pts} ${x(h.length-1)},${H}" class="sp-area"/><polyline points="${pts}" class="sp-line"/>
   <circle cx="${x(h.length-1)}" cy="${y(h[h.length-1].saude)}" r="4" class="sp-dot"/></svg><span class="muted small">últimos ${h.length} dias · linha de referência em 75</span>`}
function progMeta(m){
  const I=S.painel?.indicadores?.[m.indicador],cl=f=>Math.max(0,Math.min(1,isFinite(f)?f:0));
  if(!m.indicador||!I){const a=+m.atual||0,al=+m.alvo||0;return{f:cl(al?a/al:0),txt:`${a} de ${al}${m.unidade?' '+m.unidade:''}`}}
  if(I.sentido==='aumentar'){const al=(m.alvo===''||m.alvo==null)?(I.total||0):+m.alvo;return{f:cl(al?I.valor/al:1),txt:`${I.valor} de ${al}`}}
  const base=+m.base||0,al=+m.alvo||0,v=I.valor;
  return{f:cl(v<=al?1:base>al?(base-v)/(base-al):0),txt:v<=al?`Alvo atingido (${v})`:`${v} agora · eram ${base} · alvo ${al}`};
}

/* ---------- linha do tempo dos contratos ---------- */
S.zoom='12';S.janela=true;
const assinado=c=>!/^em processo/i.test((c.continuidade||'').trim())||/assinad/i.test(c.situacao||'');
function vLinha(){
  const today=hoje(),JAN=JANELA(),MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const all=[...S.contr.values()],com=all.filter(c=>c.vigencia).map(c=>({...c,fim:new Date(c.vigencia+'T00:00:00')})).sort((a,b)=>a.fim-b.fim);
  const semData=all.filter(c=>!c.vigencia&&assinado(c)),emProc=all.filter(c=>!c.vigencia&&!assinado(c));
  if(!com.length&&!semData.length){$('#main').innerHTML='<div class="empty">Nenhum contrato assinado cadastrado.</div>';return}
  const last=com.length?com[com.length-1].fim:today,start=new Date(today.getFullYear(),today.getMonth(),1);
  const end=S.zoom==='all'?new Date(last.getFullYear()+1,0,1):new Date(start.getFullYear(),start.getMonth()+(+S.zoom)+1,1);
  const span=end-start,x=d=>Math.max(0,Math.min(100,(d-start)/span*100)),tx=x(today),ticks=[];
  if(S.zoom==='all'){for(let y=start.getFullYear()+1;y<end.getFullYear()+1;y++)ticks.push([new Date(y,0,1),String(y)])}
  else{const st=S.zoom==='24'?3:1;for(let i=0;;i+=st){const d=new Date(start.getFullYear(),start.getMonth()+i,1);if(d>=end)break;ticks.push([d,MES[d.getMonth()]+(d.getMonth()===0||i===0?' '+String(d.getFullYear()).slice(2):'')])}}
  const grid=ticks.map(([d])=>`<i class="gridl" style="left:${x(d)}%"></i>`).join('');
  const rowHTML=(c,marks)=>`<div class="tl-row" data-id="${esc(c.id)}" tabindex="0"><div class="lbl"><b title="${esc(c.objeto)}">${esc(c.objeto)}</b><small>${esc(c.empresa||'Empresa a definir')}</small></div>
    <div class="track">${grid}<i class="today" style="left:${tx}%"></i>${marks}</div></div>`;
  let h=`<div class="tl-row axis"><div class="lbl"><small>${com.length+semData.length} contratos assinados</small></div><div class="track">
    ${ticks.map(([d,l])=>`<i class="tick" style="left:${x(d)}%"><span>${l}</span></i>`).join('')}<i class="today" style="left:${tx}%"><span>hoje ${br(isoOf(today))}</span></i></div></div>`;
  if(semData.length){h+=`<div class="grp">Assinados sem data final informada (${semData.length})</div>`+semData.map(c=>rowHTML(c,`<i class="nod" style="left:${tx}%;right:0"></i><span class="nodb" style="left:calc(${tx}% + 8px)">⚠ Data final não informada</span>`)).join('')+`<div class="grp">Com data final (${com.length})</div>`}
  h+=com.map(c=>{const d=Math.round((c.fim-today)/864e5),w=new Date(c.fim-JAN*864e5);let m='';
    if(d<0)m=`<span class="late">vencido há ${-d} dias · ${br(c.vigencia)}</span>`;
    else{const fx=x(c.fim),inR=c.fim<end,ws=new Date(Math.max(+today,+w));
      if(S.janela&&w<end){if(w>today)m+=`<i class="tbar" style="left:${tx}%;width:${x(w)-tx}%;border-radius:0"></i>`;m+=`<i class="win" style="left:${x(ws)}%;width:${(inR?fx:100)-x(ws)}%"></i>`}
      else m+=`<i class="tbar" style="left:${tx}%;width:${(inR?fx:100)-tx}%"></i>`;
      m+=inR?`<i class="end ${S.janela&&d<=JAN?'w':''}" style="left:${fx}%"></i>`:`<span class="more">até ${br(c.vigencia)} →</span>`}
    return rowHTML(c,m)}).join('');
  $('#main').innerHTML=`<div class="bar"><div class="seg" role="group" aria-label="Período">${[['12','Próximos 12 meses'],['24','24 meses'],['all','Até o último contrato']].map(([z,l])=>`<button type="button" data-z="${z}" aria-pressed="${S.zoom===z}">${l}</button>`).join('')}</div>
   <label><input type="checkbox" id="jan" ${S.janela?'checked':''}> Destacar janela de ${JAN} dias</label>
   <div class="tl-leg"><span><i class="sw" style="background:var(--s-and)"></i>Vigência restante</span><span><i class="sw win-sw"></i>Últimos ${JAN} dias</span><span><i class="sw" style="background:var(--crit-soft);border:1px solid var(--crit)"></i>Vencido</span><span><i class="sw" style="background:var(--warn-soft);border:1px dashed var(--warn)"></i>Assinado, sem data final</span></div></div>
   <div class="tl"><div class="tl-scroll"><div class="tl-inner">${h}</div></div></div>
   ${emProc.length?`<p class="muted small" style="margin-top:10px">Fora da linha do tempo por ainda estarem em contratação: ${emProc.map(c=>esc(c.objeto)).join(' · ')}.</p>`:''}`;
  $('#main .seg').onclick=e=>{const b=e.target.closest('[data-z]');if(b){S.zoom=b.dataset.z;vLinha()}};
  $('#jan').onchange=e=>{S.janela=e.target.checked;vLinha()};
  const tl=$('#main .tl');tl.onclick=e=>{const r=e.target.closest('.tl-row[data-id]');if(r)abrirContrato(r.dataset.id)};
  tl.onkeydown=e=>{const r=e.target.closest('.tl-row[data-id]');if(r&&e.key==='Enter')abrirContrato(r.dataset.id)};
}

function barrasH(linhas,{legenda=[],vazio='Sem dados.',clique=''}={}){
  if(!linhas.length)return `<p class="muted">${vazio}</p>`;
  const max=Math.max(1,...linhas.map(l=>l.partes.reduce((s,x)=>s+x.v,0)));
  return `${legenda.length>1?`<div class="legendp">${legenda.map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`:''}
   <div class="hbars">${linhas.map(l=>{const tot=l.partes.reduce((s,x)=>s+x.v,0);
    return `<div class="hb ${clique?'hb-click':''}" ${l.id?`data-${clique}="${esc(l.id)}"`:''}><span class="hb-l" title="${esc(l.rotulo)}">${esc(l.rotulo)}</span>
     <span class="hb-t"><span class="hb-f" style="width:${tot/max*100}%">${l.partes.filter(x=>x.v).map(x=>`<i style="flex:${x.v};background:${x.cor}" data-tip="${esc(l.rotulo)} · ${esc(x.nome)}: ${x.v}"></i>`).join('')}</span></span>
     <b class="hb-v">${tot}</b></div>`}).join('')}</div>`;
}

/* ---------- gráfico da aba Gestores e fiscais ---------- */
function graficoEquipe(){
  const linhas=[];
  for(const [nome,l] of pessoas()){
    const at=l.filter(x=>exigeDesig(x.p.fase)||etapa(x.p.fase)==='execucao');if(!at.length)continue;
    const g=at.filter(x=>x.papel==='Gestor'),f=at.filter(x=>x.papel==='Fiscal');
    const cg=g.filter(x=>contratosDe(x.p).length).length,cf=f.filter(x=>contratosDe(x.p).length).length;
    linhas.push({rotulo:nome,id:nome,partes:[{v:g.length,cor:'var(--s-and)',nome:`gestor (${cg} com contrato cadastrado)`},{v:f.length,cor:'var(--s-ok)',nome:`fiscal (${cf} com contrato cadastrado)`}]});
  }
  linhas.sort((a,b)=>b.partes[0].v+b.partes[1].v-(a.partes[0].v+a.partes[1].v)||a.rotulo.localeCompare(b.rotulo));
  return `<section class="card wide" style="margin-bottom:14px"><h2>Contratos e processos ativos por pessoa</h2>
   <p class="muted small" style="margin-top:-6px">Quantos processos em andamento cada pessoa acompanha como gestor ou fiscal. Passe o mouse na barra para ver quantos já têm contrato cadastrado; clique para ir à lista da pessoa.</p>
   ${barrasH(linhas,{legenda:[['Gestor','var(--s-and)'],['Fiscal','var(--s-ok)']],vazio:'Nenhuma designação em processos ativos.',clique:'pessoa'})}</section>
   <section class="card wide" style="margin-bottom:14px"><h2>Participação nos contratos</h2>
    <p class="muted small" style="margin-top:-6px">Percentual dos ${S.contr.size} contratos cadastrados em que cada servidor é gestor ou fiscal (pela designação do processo ligado ao contrato).</p>
    <div class="pizzas">${pizzaPapel('Gestor')}${pizzaPapel('Fiscal')}</div></section>`;
}

const CAT=['#257de0','#f47230','#00b894','#f2a600','#ee7fac','#008a17','#6a4ce2'];
function pizzaPapel(papel){
  const tot=S.contr.size;if(!tot)return '';
  const cont=new Map();let sem=0;
  for(const c of S.contr.values()){const p=S.proc.get(c.processo);const ns=[...new Set((p?.equipe||[]).filter(e=>e.papel===papel&&e.nome).map(e=>e.nome))];
    if(!ns.length)sem++;else ns.forEach(n=>cont.set(n,(cont.get(n)||0)+1))}
  const ord=[...cont].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pt-BR'));
  const fat=ord.slice(0,7).map(([n,v],i)=>({n,v,cor:CAT[i]}));
  const resto=ord.slice(7);if(resto.length===1)fat.push({n:resto[0][0],v:resto[0][1],cor:'#808285'});else if(resto.length)fat.push({n:`Outros (${resto.length} servidores)`,v:resto.reduce((s,x)=>s+x[1],0),cor:'#808285'});
  if(sem)fat.push({n:`Sem ${papel.toLowerCase()} designado`,v:sem,cor:'#d6dfd8',sem:true});
  const soma=fat.reduce((s,f)=>s+f.v,0),R=80,C=100;let a=-Math.PI/2;
  const arco=f=>{const ang=f.v/soma*2*Math.PI,dica=`${esc(f.n)}: ${f.v} de ${tot} contratos (${Math.round(f.v/tot*100)}%)`;
    if(ang>=2*Math.PI-1e-6){a+=ang;return `<circle cx="${C}" cy="${C}" r="${R}" fill="${f.cor}" class="fatia" data-tip="${dica}"/>`}
    const x1=C+R*Math.cos(a),y1=C+R*Math.sin(a);a+=ang;const x2=C+R*Math.cos(a),y2=C+R*Math.sin(a);
    return `<path d="M${C},${C} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${ang>Math.PI?1:0} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${f.cor}" class="fatia" data-tip="${dica}"/>`};
  const titulo=papel==='Gestor'?'Gestores':'Fiscais';
  return `<div class="pizza"><h3>${titulo}</h3>
   <svg viewBox="0 0 200 200" class="pz" role="img" aria-label="${titulo}: ${esc(fat.map(f=>f.n+' '+Math.round(f.v/tot*100)+'%').join(', '))}">${fat.map(arco).join('')}</svg>
   <ul class="pz-leg">${fat.map(f=>`<li class="${f.sem?'muted':''}"><i style="background:${f.cor}"></i><span title="${esc(f.n)}">${esc(f.n)}</span><b>${Math.round(f.v/tot*100)}%</b><small>${f.v}</small></li>`).join('')}</ul></div>`;
}

/* ---------- indicadores ---------- */
const FAIXA=v=>v>=90?['Exemplar','ex']:v>=75?['Bom','bom']:v>=50?['Em evolução','evo']:['Atenção','aten'];
function anel(v,cls){const r=30,c=2*Math.PI*r,f=Math.max(0,Math.min(100,v))/100;
  return `<svg viewBox="0 0 76 76" class="anel ${cls}" aria-hidden="true"><circle cx="38" cy="38" r="${r}" class="g-bg"/><circle cx="38" cy="38" r="${r}" class="g-fg" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 38 38)"/>
   <text x="38" y="43" text-anchor="middle" class="a-num">${v}%</text></svg>`}
function linhaTendencia(h){
  if(h.length<2)return '<p class="muted">A tendência aparece a partir do segundo dia de uso do sistema.</p>';
  const W=640,H=180,L=34,R=12,T=12,B=26,x=i=>L+i*(W-L-R)/(h.length-1),y=v=>T+(1-v/100)*(H-T-B);
  const pts=h.map((d,i)=>`${x(i).toFixed(1)},${y(d.saude).toFixed(1)}`).join(' ');
  const ticks=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gr"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`).join('');
  const lbl=[0,Math.floor((h.length-1)/2),h.length-1].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle" class="ax">${br(h[i].dia).slice(0,5)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Índice de Saúde nos últimos ${h.length} dias">${ticks}${lbl}
   <polygon points="${x(0)},${y(0)} ${pts} ${x(h.length-1)},${y(0)}" class="sp-area"/><polyline points="${pts}" class="sp-line"/>
   ${h.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.saude)}" r="${i===h.length-1?5:9}" class="${i===h.length-1?'sp-dot':'hit'}" data-tip="${br(d.dia)}: índice ${d.saude} · ${d.atrasadas} tarefa(s) atrasada(s)"/>`).join('')}</svg>`;
}
function vIndicadores(){
  const P=S.painel;if(!P){$('#main').innerHTML='<div class="empty">Calculando os indicadores…</div>';carregarPainel();return}
  const all=[...S.proc.values()],pca=all.filter(p=>p.pca===true),pcaOk=pca.filter(p=>['execucao','concluido'].includes(etapa(p.fase))).length;
  const h=P.historico||[],ant=h.length>7?h[h.length-8]:h[0];
  const delta=(atual,antes,menorMelhor)=>{if(antes==null||h.length<2)return '';const d=atual-antes;if(!d)return '<span class="dl">= estável</span>';
    const bom=menorMelhor?d<0:d>0;return `<span class="dl ${bom?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)}${menorMelhor?'':' pts'} em ${Math.min(7,h.length-1)} dias</span>`};
  const kpis=[
    ['Índice de Saúde',P.saude,'Combina os quatro indicadores abaixo',delta(P.saude,ant?.saude)],
    ['Tarefas dentro do prazo',Math.round(P.comp.tarefas*100),`${P.contagens.atrasadas} atrasada(s) de ${P.contagens.abertas} abertas`,delta(P.contagens.atrasadas,ant?.atrasadas,true).replace('pts','')],
    ['Contratos com vigência em dia',Math.round(P.comp.contratos*100),`${P.contagens.vencidos} com vigência vencida`,delta(P.contagens.vencidos,ant?.vencidos,true)],
    ['Processos ativos com gestor e fiscal',Math.round(P.comp.designacoes*100),`${P.indicadores.designados.valor} de ${P.indicadores.designados.total} processos`,''],
    ['Pendências resolvidas',Math.round(P.comp.pendencias*100),`${P.contagens.pendAbertas} ainda abertas`,delta(P.contagens.pendAbertas,ant?.pendAbertas,true)],
    ['Execução do PCA',pca.length?Math.round(pcaOk/pca.length*100):0,`${pcaOk} de ${pca.length} itens realizados ou em execução`,''],
  ];
  const porCol=COLUNAS.map(c=>({rotulo:c.nome,id:c.id,partes:[{v:all.filter(p=>faseDe(p)===c.id).length,cor:'var(--brand)',nome:'processos'}]}));
  const ativos=all.filter(p=>!['concluido','encerrado'].includes(etapa(faseDe(p))));
  const porUrg=[['urgente','Urgente','var(--u-urgente)'],['media','Média','var(--u-media)'],['baixa','Baixa','var(--u-baixa)'],['','Não definida','var(--line)']]
    .map(([k,n,c])=>({rotulo:n,partes:[{v:ativos.filter(p=>(p.urgencia||'')===k).length,cor:c,nome:'processos em andamento'}]}));
  const resp=new Map();for(const t of S.tar.values())if(t.status==='andamento'){const r=t.responsavel||'Sem responsável';if(!resp.has(r))resp.set(r,[0,0]);resp.get(r)[atrasada(t)?1:0]++}
  const porResp=[...resp].sort((a,b)=>b[1][0]+b[1][1]-a[1][0]-a[1][1]).map(([r,[ok,at]])=>({rotulo:r,partes:[{v:ok,cor:'var(--s-ok)',nome:'no prazo'},{v:at,cor:'var(--crit)',nome:'atrasadas'}]}));
  const J=JANELA(),cs=[...S.contr.values()].filter(c=>c.vigencia||assinado(c)),faixa=c=>{const d=dias(c.vigencia);return d==null?4:d<0?0:d<=30?1:d<=J?2:3};
  const porVig=[['Vigência vencida','var(--crit)'],['Vence em até 30 dias','var(--u-media)'],[`Vence em 31 a ${J} dias`,'var(--s-nao)'],[`Mais de ${J} dias`,'var(--s-ok)'],['Assinado, sem data final','var(--line)']]
    .map(([n,c],i)=>({rotulo:n,partes:[{v:cs.filter(x=>faixa(x)===i).length,cor:c,nome:'contratos'}]}));
  $('#main').innerHTML=`<div class="dash">
   <section class="card wide"><h2>Indicadores do setor</h2><div class="kpis">${kpis.map(([n,v,sub,d])=>{const [fx,cl]=FAIXA(v);
     return `<div class="kpi ${cl}">${anel(v,cl)}<div><b>${esc(n)}</b><span class="fx">${fx}</span><small class="muted">${esc(sub)}</small>${d}</div></div>`}).join('')}</div>
    <p class="muted small" style="margin:10px 0 0">Faixas: Atenção (abaixo de 50) · Em evolução (50 a 74) · Bom (75 a 89) · Exemplar (90 ou mais).</p></section>
   <section class="card half"><h2>Processos por coluna do fluxo</h2>${barrasH(porCol,{clique:'col'})}</section>
   <section class="card half"><h2>Processos em andamento por urgência</h2>${barrasH(porUrg)}</section>
   <section class="card half"><h2>Tarefas abertas por responsável</h2>${barrasH(porResp,{legenda:[['No prazo','var(--s-ok)'],['Atrasadas','var(--crit)']],vazio:'Nenhuma tarefa aberta.'})}</section>
   <section class="card half"><h2>Contratos por situação da vigência</h2>${barrasH(porVig)}</section>
  </div>`;
  const m=$('#main');ligarDica(m);
  m.onclick=e=>{const c=e.target.closest('[data-col]');if(c){S.q='';location.hash='#quadro'}};
}

/* ---------- parcerias ---------- */
const TIPOS_PARC=['Credenciamento','Convênio','Acordo de cooperação','Parceria institucional','Outro'];
function situacaoParc(x){const d=dias(x.fim);if(x.situacao==='Encerrada')return['Encerrada',''];if(d==null)return[x.situacao||'Vigente','ok'];
  if(d<0)return['Vencida','crit'];if(d<=30)return[`Vence em ${d} d`,'warn'];return[x.situacao||'Vigente','ok']}
function vParcerias(){
  const ls=[...S.parcerias.values()].filter(x=>!S.q||norm([x.nome,x.cnpj,x.tipo,x.objeto,x.sei,x.contato].join(' ')).includes(norm(S.q)))
    .sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
  $('#main').innerHTML=`<div class="bar"><input type="search" id="q" placeholder="Buscar parceiro, CNPJ, objeto ou SEI" value="${esc(S.q)}" aria-label="Buscar">
   <button class="btn pri" type="button" id="novaParc" ${S.write?'':'disabled'}>+ Nova parceria</button></div>
  <div class="tbl"><table><thead><tr><th>Parceiro</th><th>Tipo</th><th>Objeto ou benefício</th><th>SEI</th><th>Vigência</th><th>Contato</th></tr></thead><tbody>
  ${ls.map(x=>{const [st,cl]=situacaoParc(x);return `<tr class="click" data-id="${esc(x.id)}"><td><b>${esc(x.nome)}</b>${x.cnpj?`<br><span class="sei">${esc(x.cnpj)}</span>`:''}</td>
   <td>${esc(x.tipo||'')}</td><td><span class="clamp">${esc(x.objeto||'')}</span></td><td class="sei" style="white-space:nowrap">${esc(x.sei||'—')}</td>
   <td style="white-space:nowrap"><span class="chip ${cl}">${esc(st)}</span><br><span class="sei">${x.inicio||x.fim?`${br(x.inicio)} a ${br(x.fim)}`:'sem datas'}</span></td>
   <td><span class="clamp">${esc(x.contato||'')}</span></td></tr>`}).join('')||`<tr><td colspan="6" class="muted">Nenhuma parceria cadastrada${S.q?' com essa busca':''}.</td></tr>`}</tbody></table></div>`;
  const q=$('#q');q.oninput=()=>{S.q=q.value;const p=q.selectionStart;vParcerias();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  $('#novaParc').onclick=()=>abrirParceria(null,{nome:'',tipo:'Credenciamento',situacao:'Vigente'});
  $('#main tbody').onclick=e=>{const r=e.target.closest('tr[data-id]');if(r)abrirParceria(r.dataset.id)};
}

     ${id?`<button class="btn" type="button" id="paDel" ${S.write?'':'disabled'}>Excluir</button>`:''}<button class="btn pri" ${S.write?'':'disabled'}>Salvar</button></div></form></section>`);
  $('#fpa').onsubmit=async e=>{e.preventDefault();const v=k=>$('#pa-'+k).value.trim();

    try{if(id){if(!await upd('parcerias',id,d,'Parceria atualizada: '+d.nome,'edicao'))return}else await criar('parcerias',d);fechar();if(S.view==='parcerias')vParcerias()}
