<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador AssinaBot</title>
<style>
  :root {
    --fundo: #eae6df; --tela: #efeae2; --cabecalho: #075e54; --cabecalho-texto: #fff;
    --bolha-bot: #fff; --bolha-pessoa: #d9fdd3; --texto: #111b21; --suave: #667781;
    --botao: #fff; --botao-texto: #027eb5; --borda: #d1d7db; --aviso: #fff3c4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0c1317; --tela: #0b141a; --cabecalho: #202c33; --cabecalho-texto: #e9edef;
      --bolha-bot: #202c33; --bolha-pessoa: #005c4b; --texto: #e9edef; --suave: #8696a0;
      --botao: #202c33; --botao-texto: #53bdeb; --borda: #313d45; --aviso: #3b3417;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto); }
  header.topo { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  header.topo h1 { font-size: 18px; margin: 0; }
  header.topo p { margin: 0; color: var(--suave); }
  .aviso-ia { background: var(--aviso); padding: 8px 16px; font-size: 13px; }
  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 12px 16px 16px; height: calc(100vh - 90px); min-height: 520px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; height: auto; } .celular { height: 80vh; } }
  .celular { display: flex; flex-direction: column; background: var(--tela); border-radius: 14px; overflow: hidden; border: 1px solid var(--borda); min-height: 0; }
  .celular header { background: var(--cabecalho); color: var(--cabecalho-texto); padding: 10px 14px; }
  .celular header strong { display: block; font-size: 15px; }
  .celular header span { font-size: 12px; opacity: .8; }
  .conversa { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .vazio { color: var(--suave); text-align: center; margin: auto; padding: 16px; font-size: 13px; }
  .msg { max-width: 88%; padding: 6px 9px 4px; border-radius: 8px; box-shadow: 0 1px .5px rgba(11,20,26,.13); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { background: var(--bolha-bot); align-self: flex-start; }
  .msg.pessoa { background: var(--bolha-pessoa); align-self: flex-end; }
  .msg img.foto { max-width: 180px; max-height: 220px; border-radius: 6px; display: block; }
  #um-dia { border: 0; border-radius: 18px; padding: 6px 12px; font: inherit; cursor: pointer; background: var(--bolha-bot); color: var(--texto); }
  .msg .hora { font-size: 11px; color: var(--suave); text-align: right; margin-top: 2px; }
  .msg .rotulo { font-size: 11px; color: var(--suave); margin-bottom: 2px; }
  .arquivo { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; background: rgba(0,0,0,.05); color: inherit; text-decoration: none; }
  .arquivo:hover { background: rgba(0,0,0,.1); }
  .botoes { display: flex; flex-direction: column; gap: 4px; align-self: flex-start; width: min(88%, 320px); }
  .botoes button { background: var(--botao); color: var(--botao-texto); border: 0; border-radius: 8px; padding: 8px; font: inherit; font-weight: 500; cursor: pointer; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .botoes button:hover { filter: brightness(.96); }
  .barra { display: flex; gap: 6px; padding: 8px; background: var(--cabecalho); flex-wrap: wrap; }
  .barra textarea { flex: 1 1 140px; resize: none; border: 0; border-radius: 18px; padding: 8px 12px; font: inherit; background: var(--bolha-bot); color: var(--texto); height: 38px; }
  .barra button, .barra label { border: 0; border-radius: 18px; padding: 0 12px; height: 38px; font: inherit; cursor: pointer; background: var(--bolha-bot); color: var(--texto); display: inline-flex; align-items: center; gap: 4px; }
  .barra .enviar { background: #00a884; color: #fff; }
  .barra input[type=file] { display: none; }
  .menu-contato { position: relative; }
  .menu-contato ul { position: absolute; bottom: 44px; left: 0; list-style: none; margin: 0; padding: 4px; background: var(--bolha-bot); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.25); min-width: 180px; z-index: 2; }
  .menu-contato li button { width: 100%; text-align: left; border-radius: 6px; background: transparent; }
  .menu-contato li button:hover { background: rgba(0,0,0,.06); }
  b { font-weight: 600; }
</style>
</head>
<body>
<header class="topo">
  <h1>Simulador do AssinaBot</h1>
  <p>Três celulares falando com o bot de verdade. Comece mandando um PDF pelo celular do escritório.</p>
  <button type="button" id="um-dia" title="Avança o relógio do bot em um dia: quem não assinou recebe lembrete">⏩ Simular 1 dia depois</button>
</header>
<div class="aviso-ia" id="aviso-ia" hidden></div>
<main id="celulares"></main>

<script>
const estado = { pessoas: [], porTelefone: new Map() };

function formatarTelefone(t) {
  const m = /^55(\d{2})(\d{4,5})(\d{4})$/.exec(t);
  return m ? `+55 (${m[1]}) ${m[2]}-${m[3]}` : `+${t}`;
}

function escapar(texto) {
  return texto.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

/** Negrito e itálico no estilo do WhatsApp. */
function formatar(texto) {
  return escapar(texto).replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/(^|\s)_([^_\n]+)_/g, "$1<i>$2</i>");
}

async function enviar(corpo) {
  await fetch("/enviar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
}

function montarCelular(pessoa) {
  const el = document.createElement("section");
  el.className = "celular";
  el.innerHTML = `
    <header><strong>${escapar(pessoa.nome)}</strong><span>${formatarTelefone(pessoa.telefone)}</span></header>
    <div class="conversa"><div class="vazio">${pessoa.escritorio
      ? "Envie um PDF (📎) para começar."
      : "Quando o escritório enviar um documento para esta pessoa, ele aparece aqui."}</div></div>
    <form class="barra">
      <label title="Enviar PDF">📎 PDF<input type="file" class="pdf" accept="application/pdf"></label>
      <label title="Enviar foto">📷<input type="file" class="foto" accept="image/jpeg,image/png"></label>
      <span class="menu-contato"><button type="button" class="abrir-contatos" title="Compartilhar contato">👤</button></span>
      <textarea placeholder="Mensagem"></textarea>
      <button class="enviar" type="submit">Enviar</button>
    </form>`;

  const form = el.querySelector("form");
  const caixa = el.querySelector("textarea");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const texto = caixa.value.trim();
    if (!texto) return;
    caixa.value = "";
    await enviar({ telefone: pessoa.telefone, tipo: "texto", texto });
  });
  caixa.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  el.querySelector("input.foto").addEventListener("change", async (e) => {
    const foto = e.target.files[0];
    if (!foto) return;
    await fetch(`/enviar-imagem?telefone=${pessoa.telefone}`, {
      method: "POST",
      headers: { "Content-Type": foto.type === "image/png" ? "image/png" : "image/jpeg" },
      body: foto,
    });
    e.target.value = "";
  });

  el.querySelector("input.pdf").addEventListener("change", async (e) => {
    const arquivo = e.target.files[0];
    if (!arquivo) return;
    await fetch(`/enviar-pdf?telefone=${pessoa.telefone}`, {
      method: "POST",
      headers: { "Content-Type": "application/pdf", "X-Nome-Arquivo": encodeURIComponent(arquivo.name) },
      body: arquivo,
    });
    e.target.value = "";
  });

  const menu = el.querySelector(".menu-contato");
  menu.querySelector(".abrir-contatos").addEventListener("click", () => {
    const aberto = menu.querySelector("ul");
    if (aberto) { aberto.remove(); return; }
    const ul = document.createElement("ul");
    for (const outra of estado.pessoas.filter((p) => p.telefone !== pessoa.telefone)) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = outra.nome;
      b.addEventListener("click", async () => {
        ul.remove();
        await enviar({ telefone: pessoa.telefone, tipo: "contato", contatoTelefone: outra.telefone });
      });
      li.append(b);
      ul.append(li);
    }
    menu.append(ul);
  });

  return el;
}

function mostrar(m) {
  const celular = estado.porTelefone.get(m.telefone);
  if (!celular) return;
  const conversa = celular.querySelector(".conversa");
  conversa.querySelector(".vazio")?.remove();

  const bolha = document.createElement("div");
  bolha.className = `msg ${m.direcao}`;
  let html = "";
  if (m.template) html += `<div class="rotulo">Mensagem de modelo (template)</div>`;
  if (m.arquivo) {
    html += `<a class="arquivo" href="/arquivo/${m.arquivo.id}" target="_blank" rel="noopener">📄 <span>${escapar(m.arquivo.nome)}</span></a>`;
  }
  if (m.imagem) html += `<a href="/arquivo/${m.imagem.id}" target="_blank" rel="noopener"><img class="foto" alt="Foto enviada" src="/arquivo/${m.imagem.id}"></a>`;
  if (m.texto) html += `<div>${formatar(m.texto)}</div>`;
  const hora = new Date(m.em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  html += `<div class="hora">${hora}</div>`;
  bolha.innerHTML = html;
  conversa.append(bolha);

  if (m.botoes?.length) {
    const botoes = document.createElement("div");
    botoes.className = "botoes";
    for (const b of m.botoes) {
      const btn = document.createElement("button");
      btn.textContent = b.titulo;
      btn.addEventListener("click", () => enviar({ telefone: m.telefone, tipo: "botao", botaoId: b.id, botaoTitulo: b.titulo }));
      botoes.append(btn);
    }
    conversa.append(botoes);
  }
  conversa.scrollTop = conversa.scrollHeight;
}

async function iniciar() {
  const dados = await (await fetch("/estado")).json();
  estado.pessoas = dados.pessoas;
  const area = document.getElementById("celulares");
  for (const p of dados.pessoas) {
    const el = montarCelular(p);
    estado.porTelefone.set(p.telefone, el);
    area.append(el);
  }
  if (!dados.comIa) {
    const aviso = document.getElementById("aviso-ia");
    aviso.hidden = false;
    aviso.textContent = "Modo demonstração: sem a chave da Anthropic a IA não lê o PDF. Depois de enviar o documento, toque em \"Corrigir\" e escreva as partes, ex.: outorgante: Maria da Silva; outorgado: João Pereira";
  }
  for (const m of dados.mensagens) mostrar(m);
  document.getElementById("um-dia").addEventListener("click", async () => {
    const { dias } = await (await fetch("/um-dia", { method: "POST" })).json();
    document.getElementById("um-dia").textContent = `⏩ Simular 1 dia depois (+${dias})`;
  });
  new EventSource("/eventos").onmessage = (e) => mostrar(JSON.parse(e.data));
}

iniciar();
</script>
</body>
</html>
